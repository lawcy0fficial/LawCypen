<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110" role="img" aria-label="ALL 28 TABS AT A GLANCE">
  <defs>
    <linearGradient id="bg-tabs" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#05080d"/>
      <stop offset="45%" stop-color="#0a1118"/>
      <stop offset="100%" stop-color="#05080d"/>
    </linearGradient>
    <linearGradient id="line-tabs" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d9ff" stop-opacity="0"/>
      <stop offset="15%" stop-color="#00d9ff" stop-opacity="1"/>
      <stop offset="85%" stop-color="#00d9ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00d9ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow-tabs"><feGaussianBlur stdDeviation="3"/></filter>
    <style>
      .trav-tabs { animation: trav-tabs 3.6s linear infinite; }
      .fw-tabs { animation: fw-tabs .7s ease-out; }
      @keyframes trav-tabs { 0% { transform: translateX(-60px); opacity:0; } 10% { opacity:1; } 90% { opacity:1; } 100% { transform: translateX(1160px); opacity:0; } }
      @keyframes fw-tabs { from { opacity:0; transform: translateY(6px);} to { opacity:1; transform: translateY(0);} }
    </style>
  </defs>
  <rect width="1200" height="110" fill="url(#bg-tabs)"/>
  <rect width="1200" height="110" fill="none"/>
  <g class="fw-tabs">
    <text x="60" y="52" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="46" font-weight="800" fill="#00d9ff" opacity="0.18">17</text>
    <text x="120" y="50" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="24" font-weight="800" letter-spacing="2" fill="#eaf6ff">ALL 28 TABS AT A GLANCE</text>
    <text x="120" y="76" font-family="ui-monospace,monospace" font-size="13.5" fill="#8fa3b8">Who sends traffic, who stays local</text>
  </g>
  <line x1="30" y1="95" x2="1170" y2="95" stroke="url(#line-tabs)" stroke-width="1.4"/>
  <circle class="trav-tabs" cx="0" cy="95" r="3.5" fill="#00d9ff" filter="url(#glow-tabs)"/>
  <g fill="#00d9ff" opacity="0.7">
    <circle cx="1170" cy="30" r="2"/><circle cx="1150" cy="30" r="2"/><circle cx="1130" cy="30" r="2"/>
  </g>
</svg>
