<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="Author credit banner">
  <defs>
    <radialGradient id="ab-bg" cx="15%" cy="50%" r="90%">
      <stop offset="0%" stop-color="#0c1620"/>
      <stop offset="100%" stop-color="#05080d"/>
    </radialGradient>
    <linearGradient id="ab-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="100%" stop-color="#00d9ff"/>
    </linearGradient>
    <filter id="ab-glow"><feGaussianBlur stdDeviation="4"/></filter>
    
    <style>
      @keyframes drift {{ 0% {{ transform: translate(0,0); }} 50% {{ transform: translate(6px,-8px); }} 100% {{ transform: translate(0,0); }} }}
      @keyframes flicker {{ 0%,19%,21%,55%,57%,100% {{ opacity: 1; }} 20%,56% {{ opacity: .55; }} }}
      @keyframes sweep {{ 0% {{ transform: translateX(-120%); }} 100% {{ transform: translateX(220%); }} }}
      @keyframes blink {{ 0%,100% {{ opacity: 1; }} 50% {{ opacity: 0; }} }}
      @keyframes pulseGlow {{ 0%,100% {{ opacity: .35; }} 50% {{ opacity: .9; }} }}
      @keyframes rot {{ from {{ transform: rotate(0deg); }} to {{ transform: rotate(360deg); }} }}
    </style>

    <style>
      .ab-ring { transform-origin: 85px 85px; animation: rot 12s linear infinite; }
      .ab-pulse { animation: pulseGlow 2.4s ease-in-out infinite; }
    </style>
  </defs>
  <clipPath id="ab-clip"><rect width="1200" height="170" rx="16"/></clipPath>
  <g clip-path="url(#ab-clip)"><rect width="1200" height="170" fill="url(#ab-bg)"/></g>
  <rect x="1" y="1" width="1198" height="168" rx="16" fill="none" stroke="#00d9ff" stroke-opacity="0.35" stroke-width="1.3"/>

  <g class="ab-ring" opacity="0.7">
    <circle cx="85" cy="85" r="46" fill="none" stroke="url(#ab-ring)" stroke-width="1.4" stroke-dasharray="3 9"/>
  </g>
  <circle class="ab-pulse" cx="85" cy="85" r="34" fill="#00ff9d" opacity="0.1"/>
  <g fill="none" stroke="#00ff9d" stroke-width="3" stroke-linecap="round" filter="url(#ab-glow)"><circle cx="85" cy="76" r="10"/><path d="M64 108 C64 92 106 92 106 108"/></g>

  <text x="150" y="72" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="14" letter-spacing="3" fill="#7d92a6">BUILT &amp; MAINTAINED BY</text>
  <text x="150" y="106" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="30" font-weight="800" fill="#eaf6ff">lawCYpen Maintainers</text>
  <text x="150" y="132" font-family="ui-monospace,monospace" font-size="13.5" fill="#8fa3b8">Issues, detector modules, and pull requests welcome — see Contributing in the README.</text>

  <g transform="translate(940,85.0)" fill="none" stroke="#00d9ff" stroke-width="1.6" opacity="0.85">
    <rect x="-70" y="-20" width="40" height="40" rx="8"/>
    <rect x="-10" y="-20" width="40" height="40" rx="8"/>
    <rect x="50" y="-20" width="40" height="40" rx="8"/>
  </g>
  <g fill="#00d9ff" font-family="ui-monospace,monospace" font-size="16" font-weight="700" text-anchor="middle">
    <text x="890" y="91.0">&lt;/&gt;</text>
    <text x="950" y="91.0">&#9733;</text>
    <text x="1010" y="91.0">@</text>
  </g>
</svg>
