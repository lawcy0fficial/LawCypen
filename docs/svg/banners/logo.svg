<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="lawCYpen logo">
  <defs>
    <radialGradient id="lg-bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#0c1620"/>
      <stop offset="100%" stop-color="#050810"/>
    </radialGradient>
    <linearGradient id="lg-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="100%" stop-color="#00d9ff"/>
    </linearGradient>
    <filter id="lg-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <style>
      @keyframes drift {{ 0% {{ transform: translate(0,0); }} 50% {{ transform: translate(6px,-8px); }} 100% {{ transform: translate(0,0); }} }}
      @keyframes flicker {{ 0%,19%,21%,55%,57%,100% {{ opacity: 1; }} 20%,56% {{ opacity: .55; }} }}
      @keyframes sweep {{ 0% {{ transform: translateX(-120%); }} 100% {{ transform: translateX(220%); }} }}
      @keyframes blink {{ 0%,100% {{ opacity: 1; }} 50% {{ opacity: 0; }} }}
      @keyframes pulseGlow {{ 0%,100% {{ opacity: .35; }} 50% {{ opacity: .9; }} }}
      @keyframes rot {{ from {{ transform: rotate(0deg); }} to {{ transform: rotate(360deg); }} }}
    </style>

    <style>
      .ring1 { transform-origin: 160px 160px; animation: rot 14s linear infinite; }
      .ring2 { transform-origin: 160px 160px; animation: rot 22s linear infinite reverse; }
      .cursor { animation: blink 1.1s step-start infinite; }
      .core { animation: pulseGlow 2.6s ease-in-out infinite; }
    </style>
  </defs>
  <circle cx="160" cy="160" r="155" fill="url(#lg-bg)"/>
  <g class="ring1" opacity="0.8">
    <circle cx="160" cy="160" r="132" fill="none" stroke="url(#lg-accent)" stroke-width="1.5" stroke-dasharray="4 14" stroke-linecap="round"/>
  </g>
  <g class="ring2" opacity="0.5">
    <circle cx="160" cy="160" r="114" fill="none" stroke="#b829ff" stroke-width="1" stroke-dasharray="2 10" stroke-linecap="round"/>
  </g>

  <!-- hexagonal shield emblem -->
  <polygon points="160,58 246,104 246,196 160,242 74,196 74,104" fill="#081018" stroke="url(#lg-accent)" stroke-width="2.4" filter="url(#lg-glow)"/>
  <polygon points="160,58 246,104 246,196 160,242 74,196 74,104" fill="none" stroke="url(#lg-accent)" stroke-width="0.8" opacity="0.4" transform="scale(0.93)" transform-origin="160 160"/>

  <circle class="core" cx="160" cy="160" r="58" fill="#00ff9d" opacity="0.08"/>

  <!-- terminal bracket mark: < C > -->
  <g font-family="ui-monospace,'JetBrains Mono',monospace" font-weight="800" filter="url(#lg-glow)">
    <text x="160" y="178" text-anchor="middle" font-size="70" fill="url(#lg-accent)">&lt;C&gt;</text>
  </g>
  <rect class="cursor" x="192" y="140" width="10" height="44" fill="#00ff9d"/>

  <text x="160" y="278" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="26" font-weight="800" letter-spacing="1" fill="#eaf6ff">lawCYpen</text>
  <text x="160" y="298" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" letter-spacing="4" fill="#00d9ff" opacity="0.85">WEB APP PENTEST SUITE</text>
</svg>
