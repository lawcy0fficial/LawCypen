<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" role="img" aria-label="Authorized use only">
  <defs>
    <linearGradient id="bb-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d0403"/>
      <stop offset="50%" stop-color="#140705"/>
      <stop offset="100%" stop-color="#0d0403"/>
    </linearGradient>
    <pattern id="bb-hazard" width="24" height="24" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="12" height="24" fill="#ff3860" opacity="0.05"/>
    </pattern>
    <filter id="bb-glow"><feGaussianBlur stdDeviation="3"/></filter>
    
    <style>
      @keyframes drift {{ 0% {{ transform: translate(0,0); }} 50% {{ transform: translate(6px,-8px); }} 100% {{ transform: translate(0,0); }} }}
      @keyframes flicker {{ 0%,19%,21%,55%,57%,100% {{ opacity: 1; }} 20%,56% {{ opacity: .55; }} }}
      @keyframes sweep {{ 0% {{ transform: translateX(-120%); }} 100% {{ transform: translateX(220%); }} }}
      @keyframes blink {{ 0%,100% {{ opacity: 1; }} 50% {{ opacity: 0; }} }}
      @keyframes pulseGlow {{ 0%,100% {{ opacity: .35; }} 50% {{ opacity: .9; }} }}
      @keyframes rot {{ from {{ transform: rotate(0deg); }} to {{ transform: rotate(360deg); }} }}
    </style>

    <style>
      .bb-pulse { animation: pulseGlow 2.2s ease-in-out infinite; }
      .bb-blink { animation: blink 1.3s ease-in-out infinite; }
    </style>
  </defs>
  <clipPath id="bb-clip"><rect width="1200" height="210" rx="16"/></clipPath>
  <g clip-path="url(#bb-clip)">
    <rect width="1200" height="210" fill="url(#bb-bg)"/>
    <rect width="1200" height="210" fill="url(#bb-hazard)"/>
  </g>
  <rect x="1" y="1" width="1198" height="208" rx="16" fill="none" stroke="#ff3860" stroke-opacity="0.5" stroke-width="1.4"/>

  <circle class="bb-blink" cx="66" cy="105.0" r="7" fill="#ff3860" filter="url(#bb-glow)"/>
  <text x="100" y="99.0" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="22" font-weight="800" letter-spacing="1" fill="#ff8a95">AUTHORIZED-SCOPE TESTING ONLY</text>
  <text x="100" y="127.0" font-family="ui-monospace,monospace" font-size="14.5" fill="#c9a9ad">Use lawCYpen only on systems you have written authorization to test. Scope is enforced in software — nothing outside your authorized targets is stored.</text>

  <g transform="translate(1040,105.0)" class="bb-pulse">
    <polygon points="0,-34 30,20 -30,20" fill="none" stroke="#ffb800" stroke-width="2.4"/>
    <text x="0" y="10" text-anchor="middle" font-size="26" font-weight="800" fill="#ffb800">!</text>
  </g>

  <text x="100" y="184" font-family="ui-monospace,monospace" font-size="12" letter-spacing="2" fill="#7d5257">SCOPE ENFORCED IN SOFTWARE &#160;·&#160; MANIFEST V3 &#160;·&#160; CHROME + FIREFOX</text>
</svg>
