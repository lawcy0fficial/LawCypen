<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Intruder attack types">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00d9ff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3b8"/></marker>
    <style>
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes rot { to { transform: rotate(360deg) } }
      @keyframes fall { from { transform: translateY(-260px) } to { transform: translateY(420px) } }
      @keyframes dash { to { stroke-dashoffset: -40 } }
      @keyframes hl { 0%,100% { opacity:0 } 50% { opacity:.35 } }
      .p { animation: pulse 2.4s ease-in-out infinite }
      .d { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite }
      
    </style>
  </defs>
  <rect width="1200" height="330" rx="18" fill="#050810"/>
  <rect width="1200" height="330" rx="18" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="328" rx="18" fill="none" stroke="#00d9ff" stroke-opacity="0.28"/>
<text x="40" y="40" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="17" font-weight="800" letter-spacing="1.5" fill="#eaf6ff">INTRUDER — FOUR ATTACK TYPES</text><text x="40" y="62" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#8fa3b8">Positions × payload lists</text><rect x="46.0" y="90" width="260.0" height="200" rx="14" fill="#0a121b" stroke="#00d9ff" stroke-width="1.5"/><text x="176.0" y="122" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="800" fill="#00d9ff">SNIPER</text><rect x="70.0" y="146" width="44" height="22" rx="5" fill="#00d9ff" opacity="0.9" style="animation: pulse 2.0s ease-in-out infinite"/><rect x="130.0" y="146" width="44" height="22" rx="5" fill="#22303f" opacity="0.25" style="animation: pulse 2.5s ease-in-out infinite"/><rect x="190.0" y="146" width="44" height="22" rx="5" fill="#22303f" opacity="0.25" style="animation: pulse 3.0s ease-in-out infinite"/><text x="176.0" y="206" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#eaf6ff">each position, one at a time</text><text x="176.0" y="262" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="700" fill="#00d9ff">N × M requests</text><rect x="326.0" y="90" width="260.0" height="200" rx="14" fill="#0a121b" stroke="#00ff9d" stroke-width="1.5"/><text x="456.0" y="122" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="800" fill="#00ff9d">BATTERING RAM</text><rect x="350.0" y="146" width="44" height="22" rx="5" fill="#00ff9d" opacity="0.9" style="animation: pulse 2.0s ease-in-out infinite"/><rect x="410.0" y="146" width="44" height="22" rx="5" fill="#00ff9d" opacity="0.9" style="animation: pulse 2.5s ease-in-out infinite"/><rect x="470.0" y="146" width="44" height="22" rx="5" fill="#00ff9d" opacity="0.9" style="animation: pulse 3.0s ease-in-out infinite"/><text x="456.0" y="206" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#eaf6ff">same payload in all positions</text><text x="456.0" y="262" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="700" fill="#00ff9d">M requests</text><rect x="606.0" y="90" width="260.0" height="200" rx="14" fill="#0a121b" stroke="#ffb800" stroke-width="1.5"/><text x="736.0" y="122" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="800" fill="#ffb800">PITCHFORK</text><rect x="630.0" y="146" width="44" height="22" rx="5" fill="#ffb800" opacity="0.9" style="animation: pulse 2.0s ease-in-out infinite"/><rect x="690.0" y="146" width="44" height="22" rx="5" fill="#ffb800" opacity="0.9" style="animation: pulse 2.5s ease-in-out infinite"/><rect x="750.0" y="146" width="44" height="22" rx="5" fill="#ffb800" opacity="0.9" style="animation: pulse 3.0s ease-in-out infinite"/><text x="736.0" y="206" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#eaf6ff">lists advance in lockstep</text><text x="736.0" y="262" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="700" fill="#ffb800">min(M) requests</text><rect x="886.0" y="90" width="260.0" height="200" rx="14" fill="#0a121b" stroke="#ff3860" stroke-width="1.5"/><text x="1016.0" y="122" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="800" fill="#ff3860">CLUSTER BOMB</text><rect x="910.0" y="146" width="44" height="22" rx="5" fill="#ff3860" opacity="0.9" style="animation: pulse 2.0s ease-in-out infinite"/><rect x="970.0" y="146" width="44" height="22" rx="5" fill="#ff3860" opacity="0.9" style="animation: pulse 2.5s ease-in-out infinite"/><rect x="1030.0" y="146" width="44" height="22" rx="5" fill="#ff3860" opacity="0.9" style="animation: pulse 3.0s ease-in-out infinite"/><text x="1016.0" y="206" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#eaf6ff">every combination</text><text x="1016.0" y="262" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="700" fill="#ff3860">M1 × M2 × … requests</text>
</svg>
