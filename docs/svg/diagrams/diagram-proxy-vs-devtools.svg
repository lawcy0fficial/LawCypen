<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Proxy vs DevTools model">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00d9ff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3b8"/></marker>
    <style>
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes rot { to { transform: rotate(360deg) } }
      @keyframes fall { from { transform: translateY(-260px) } to { transform: translateY(420px) } }
      @keyframes dash { to { stroke-dashoffset: -40 } }
      @keyframes hl { 0%,100% { opacity:0 } 50% { opacity:.35 } }
      .p { animation: pulse 2.4s ease-in-out infinite }
      .d { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite }
      
    </style>
  </defs>
  <rect width="1200" height="420" rx="18" fill="#050810"/>
  <rect width="1200" height="420" rx="18" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="418" rx="18" fill="none" stroke="#00d9ff" stroke-opacity="0.28"/>
<text x="40" y="40" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="17" font-weight="800" letter-spacing="1.5" fill="#eaf6ff">PROXY MODEL vs DEVTOOLS MODEL</text><line x1="600" y1="60" x2="600" y2="390" stroke="#22303f" stroke-dasharray="4 6"/><text x="300" y="74" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#ffb800">BURP SUITE — external proxy</text><rect x="60" y="120" width="150" height="70" rx="11" fill="#0a121b" stroke="#00d9ff" stroke-width="1.6"/><rect x="60" y="120" width="150" height="70" rx="11" fill="#00d9ff" opacity="0.06"/><text x="135.0" y="160.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">Browser</text><rect x="255" y="120" width="150" height="70" rx="11" fill="#0a121b" stroke="#ffb800" stroke-width="1.6"/><rect x="255" y="120" width="150" height="70" rx="11" fill="#ffb800" opacity="0.06"/><text x="330.0" y="149.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">Burp Proxy</text><text x="330.0" y="168.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#ffb800">MITM + CA cert</text><rect x="450" y="120" width="110" height="70" rx="11" fill="#0a121b" stroke="#00ff9d" stroke-width="1.6"/><rect x="450" y="120" width="110" height="70" rx="11" fill="#00ff9d" opacity="0.06"/><text x="505.0" y="160.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">Server</text><line x1="210" y1="155" x2="255" y2="155" stroke="#ffb800" stroke-width="1.7" class="d" marker-end="url(#arr)"/><line x1="405" y1="155" x2="450" y2="155" stroke="#ffb800" stroke-width="1.7" class="d" marker-end="url(#arr)"/><circle r="5" fill="#ffb800" filter="url(#glow)"><animateMotion dur="2.6s" begin="0s" repeatCount="indefinite" path="M210 155 L450 155"/></circle><text x="70" y="250" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="400" fill="#ff3860">✕ Install CA certificate to read HTTPS</text><text x="70" y="280" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="400" fill="#ff3860">✕ Certificate pinning can break the app</text><text x="70" y="310" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="400" fill="#ff3860">✕ Separate app, separate window</text><text x="70" y="340" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="400" fill="#ff3860">✕ Capture is proxy-wide unless scoped</text><text x="900" y="74" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#00ff9d">lawCYpen — inside the browser</text><rect x="660" y="120" width="330" height="70" rx="11" fill="#0a121b" stroke="#00ff9d" stroke-width="1.6"/><rect x="660" y="120" width="330" height="70" rx="11" fill="#00ff9d" opacity="0.06"/><text x="825.0" y="149.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">Browser tab + DevTools</text><text x="825.0" y="168.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#00ff9d">lawCYpen panel reads the Network API</text><rect x="1040" y="120" width="110" height="70" rx="11" fill="#0a121b" stroke="#00ff9d" stroke-width="1.6"/><rect x="1040" y="120" width="110" height="70" rx="11" fill="#00ff9d" opacity="0.06"/><text x="1095.0" y="160.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">Server</text><line x1="990" y1="155" x2="1040" y2="155" stroke="#00ff9d" stroke-width="1.7" class="d" marker-end="url(#arr)"/><circle r="5" fill="#00ff9d" filter="url(#glow)"><animateMotion dur="2.6s" begin="1s" repeatCount="indefinite" path="M660 155 L1150 155"/></circle><text x="670" y="250" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="400" fill="#00ff9d">✓ No CA cert — browser already decrypted it</text><text x="670" y="280" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="400" fill="#00ff9d">✓ Sees exactly what the Network panel sees</text><text x="670" y="310" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="400" fill="#00ff9d">✓ One F12 away, same tab</text><text x="670" y="340" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="400" fill="#00ff9d">✓ Capture is tab-scoped + scope-filtered</text><text x="600" y="400" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">Trade-off: no raw sockets, no MITM of other apps — see Known Limitations</text>
</svg>
