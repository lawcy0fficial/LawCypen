<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Authorization matrix">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00d9ff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3b8"/></marker>
    <style>
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes rot { to { transform: rotate(360deg) } }
      @keyframes fall { from { transform: translateY(-260px) } to { transform: translateY(420px) } }
      @keyframes dash { to { stroke-dashoffset: -40 } }
      @keyframes hl { 0%,100% { opacity:0 } 50% { opacity:.35 } }
      .p { animation: pulse 2.4s ease-in-out infinite }
      .d { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite }
      
    </style>
  </defs>
  <rect width="1200" height="360" rx="18" fill="#050810"/>
  <rect width="1200" height="360" rx="18" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="358" rx="18" fill="none" stroke="#00d9ff" stroke-opacity="0.28"/>
<text x="40" y="40" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="17" font-weight="800" letter-spacing="1.5" fill="#eaf6ff">AUTHORIZATION MATRIX — REPLAY VS ALL ROLES</text><text x="40" y="62" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#8fa3b8">One captured request, every saved role session, one table</text><text x="60" y="105" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="700" fill="#00d9ff">ROLE</text><text x="300" y="105" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="700" fill="#00d9ff">STATUS</text><text x="460" y="105" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="700" fill="#00d9ff">SIZE</text><text x="620" y="105" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="700" fill="#00d9ff">VERDICT</text><rect x="40" y="110" width="1000" height="38" rx="8" fill="#0a121b" stroke="#00ff9d" stroke-opacity="0.5"/><text x="60" y="134" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="400" fill="#eaf6ff">admin</text><text x="300" y="134" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#00ff9d">200</text><text x="460" y="134" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="400" fill="#8fa3b8">4.2 KB</text><text x="620" y="134" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="400" fill="#00ff9d">baseline</text><rect x="40" y="156" width="1000" height="38" rx="8" fill="#0a121b" stroke="#ff3860" stroke-opacity="0.5"/><rect x="40" y="156" width="1000" height="38" rx="8" fill="#ff3860" opacity="0.15" style="animation: hl 2s ease-in-out infinite"/><text x="60" y="180" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="400" fill="#eaf6ff">editor</text><text x="300" y="180" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#ff3860">200</text><text x="460" y="180" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="400" fill="#8fa3b8">4.2 KB</text><text x="620" y="180" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="400" fill="#ff3860">SAME AS ADMIN — investigate</text><rect x="40" y="202" width="1000" height="38" rx="8" fill="#0a121b" stroke="#00ff9d" stroke-opacity="0.5"/><text x="60" y="226" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="400" fill="#eaf6ff">viewer</text><text x="300" y="226" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#00ff9d">403</text><text x="460" y="226" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="400" fill="#8fa3b8">0.1 KB</text><text x="620" y="226" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="400" fill="#00ff9d">denied (expected)</text><rect x="40" y="248" width="1000" height="38" rx="8" fill="#0a121b" stroke="#00ff9d" stroke-opacity="0.5"/><text x="60" y="272" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="400" fill="#eaf6ff">anonymous</text><text x="300" y="272" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#00ff9d">302</text><text x="460" y="272" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="400" fill="#8fa3b8">0.3 KB</text><text x="620" y="272" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="400" fill="#00ff9d">redirect to login</text><text x="40" y="334" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#8fa3b8">A lower-privileged role receiving the same response as a higher one is a broken-access-control lead.</text>
</svg>
