<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="History filters">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00d9ff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3b8"/></marker>
    <style>
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes rot { to { transform: rotate(360deg) } }
      @keyframes fall { from { transform: translateY(-260px) } to { transform: translateY(420px) } }
      @keyframes dash { to { stroke-dashoffset: -40 } }
      @keyframes hl { 0%,100% { opacity:0 } 50% { opacity:.35 } }
      .p { animation: pulse 2.4s ease-in-out infinite }
      .d { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite }
      
    </style>
  </defs>
  <rect width="1200" height="360" rx="18" fill="#050810"/>
  <rect width="1200" height="360" rx="18" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="358" rx="18" fill="none" stroke="#00d9ff" stroke-opacity="0.28"/>
<text x="40" y="40" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="17" font-weight="800" letter-spacing="1.5" fill="#eaf6ff">HTTP HISTORY FILTER BOX</text><text x="40" y="62" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#8fa3b8">Plain text plus a few Burp-style shortcuts</text><rect x="40" y="84" width="260" height="32" rx="8" fill="#03060b" stroke="#00d9ff" stroke-opacity="0.8"/><text x="56" y="105" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" fill="#00d9ff">login</text><line x1="304" y1="100" x2="340" y2="100" stroke="#00d9ff" stroke-width="1.7" marker-end="url(#arr)"/><text x="352" y="105" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12.5" font-weight="400" fill="#eaf6ff">substring match on method, URL, and more</text><rect x="40" y="126" width="260" height="32" rx="8" fill="#03060b" stroke="#ff3860" stroke-opacity="0.8"/><text x="56" y="147" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" fill="#ff3860">status:4xx</text><line x1="304" y1="142" x2="340" y2="142" stroke="#ff3860" stroke-width="1.7" marker-end="url(#arr)"/><text x="352" y="147" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12.5" font-weight="400" fill="#eaf6ff">any 400-499 response (also 1xx, 2xx, 3xx, 5xx)</text><rect x="40" y="168" width="260" height="32" rx="8" fill="#03060b" stroke="#ff3860" stroke-opacity="0.8"/><text x="56" y="189" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" fill="#ff3860">status:&gt;=400</text><line x1="304" y1="184" x2="340" y2="184" stroke="#ff3860" stroke-width="1.7" marker-end="url(#arr)"/><text x="352" y="189" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12.5" font-weight="400" fill="#eaf6ff">comparison: &gt;=  &lt;=  &gt;  &lt;  =</text><rect x="40" y="210" width="260" height="32" rx="8" fill="#03060b" stroke="#00ff9d" stroke-opacity="0.8"/><text x="56" y="231" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" fill="#00ff9d">status:200</text><line x1="304" y1="226" x2="340" y2="226" stroke="#00ff9d" stroke-width="1.7" marker-end="url(#arr)"/><text x="352" y="231" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12.5" font-weight="400" fill="#eaf6ff">exact status code</text><rect x="40" y="252" width="260" height="32" rx="8" fill="#03060b" stroke="#ffb800" stroke-opacity="0.8"/><text x="56" y="273" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" fill="#ffb800">note:</text><line x1="304" y1="268" x2="340" y2="268" stroke="#ffb800" stroke-width="1.7" marker-end="url(#arr)"/><text x="352" y="273" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12.5" font-weight="400" fill="#eaf6ff">only entries you annotated  (also: notes:)</text><rect x="40" y="294" width="260" height="32" rx="8" fill="#03060b" stroke="#ff3ec9" stroke-opacity="0.8"/><text x="56" y="315" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" fill="#ff3ec9">flagged:</text><line x1="304" y1="310" x2="340" y2="310" stroke="#ff3ec9" stroke-width="1.7" marker-end="url(#arr)"/><text x="352" y="315" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12.5" font-weight="400" fill="#eaf6ff">only colour-highlighted entries  (also: highlighted:)</text><text x="40" y="342" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#8fa3b8">An unrecognised status: expression falls through safely instead of erroring on a typo.</text>
</svg>
