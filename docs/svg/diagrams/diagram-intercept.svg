<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Intercept">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00d9ff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3b8"/></marker>
    <style>
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes rot { to { transform: rotate(360deg) } }
      @keyframes fall { from { transform: translateY(-260px) } to { transform: translateY(420px) } }
      @keyframes dash { to { stroke-dashoffset: -40 } }
      @keyframes hl { 0%,100% { opacity:0 } 50% { opacity:.35 } }
      .p { animation: pulse 2.4s ease-in-out infinite }
      .d { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite }
      
    </style>
  </defs>
  <rect width="1200" height="300" rx="18" fill="#050810"/>
  <rect width="1200" height="300" rx="18" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="298" rx="18" fill="none" stroke="#00d9ff" stroke-opacity="0.28"/>
<text x="40" y="40" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="17" font-weight="800" letter-spacing="1.5" fill="#eaf6ff">REPEATER INTERCEPT — HOLD THE RESPONSE</text><text x="40" y="62" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#8fa3b8">Intercept ON: each Repeater send pauses on the response for review and editing</text><rect x="40" y="120" width="170" height="80" rx="11" fill="#0a121b" stroke="#00d9ff" stroke-width="1.6"/><rect x="40" y="120" width="170" height="80" rx="11" fill="#00d9ff" opacity="0.06"/><text x="125.0" y="154.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">Send</text><text x="125.0" y="173.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#00d9ff">Ctrl/Cmd+Enter</text><rect x="270" y="120" width="200" height="80" rx="11" fill="#0a121b" stroke="#ffb800" stroke-width="1.6"/><rect x="270" y="120" width="200" height="80" rx="11" fill="#ffb800" opacity="0.06"/><text x="370.0" y="154.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">Response arrives</text><text x="370.0" y="173.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#ffb800">INTERCEPTED</text><rect x="540" y="120" width="200" height="80" rx="11" fill="#0a121b" stroke="#b829ff" stroke-width="1.6"/><rect x="540" y="120" width="200" height="80" rx="11" fill="#b829ff" opacity="0.06"/><text x="640.0" y="154.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">Edit response</text><text x="640.0" y="173.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#b829ff">optional</text><rect x="830" y="70" width="200" height="70" rx="11" fill="#0a121b" stroke="#00ff9d" stroke-width="1.6"/><rect x="830" y="70" width="200" height="70" rx="11" fill="#00ff9d" opacity="0.06"/><text x="930.0" y="99.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">Forward ▶</text><text x="930.0" y="118.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#00ff9d">→ Response tab (Ctrl+Enter)</text><rect x="830" y="180" width="200" height="70" rx="11" fill="#0a121b" stroke="#ff3860" stroke-width="1.6"/><rect x="830" y="180" width="200" height="70" rx="11" fill="#ff3860" opacity="0.06"/><text x="930.0" y="209.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">Drop</text><text x="930.0" y="228.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#ff3860">discard edits (Esc)</text><line x1="210" y1="160" x2="270" y2="160" stroke="#00d9ff" stroke-width="1.7" class="d" marker-end="url(#arr)"/><line x1="470" y1="160" x2="540" y2="160" stroke="#ffb800" stroke-width="1.7" class="d" marker-end="url(#arr)"/><line x1="740" y1="145" x2="830" y2="105" stroke="#00ff9d" stroke-width="1.7" class="d" marker-end="url(#arr)"/><line x1="740" y1="175" x2="830" y2="215" stroke="#ff3860" stroke-width="1.7" class="d" marker-end="url(#arr)"/><text x="40" y="278" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#8fa3b8">This is a response hold on Repeater sends — it is not a system-wide request proxy.</text>
</svg>
