<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Request limits">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00d9ff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3b8"/></marker>
    <style>
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes rot { to { transform: rotate(360deg) } }
      @keyframes fall { from { transform: translateY(-260px) } to { transform: translateY(420px) } }
      @keyframes dash { to { stroke-dashoffset: -40 } }
      @keyframes hl { 0%,100% { opacity:0 } 50% { opacity:.35 } }
      .p { animation: pulse 2.4s ease-in-out infinite }
      .d { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite }
      
    </style>
  </defs>
  <rect width="1200" height="470" rx="18" fill="#050810"/>
  <rect width="1200" height="470" rx="18" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="468" rx="18" fill="none" stroke="#00d9ff" stroke-opacity="0.28"/>
<text x="40" y="40" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="17" font-weight="800" letter-spacing="1.5" fill="#eaf6ff">REQUEST LIMITS AND DEFAULTS</text><text x="40" y="62" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#8fa3b8">Every request-sending sweep has a ceiling and a delay you control</text><rect x="40" y="76" width="1120" height="52" rx="12" fill="#ff3860" opacity="0.12" stroke="#ff3860"/><text x="600" y="108" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="15" font-weight="800" fill="#ff3860">HARD ABSOLUTE CEILING: 5,000 requests per run — regardless of what is typed in</text><text x="60" y="164" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="800" fill="#00d9ff">TOOL</text><text x="380" y="164" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="800" fill="#00d9ff">DEFAULT MAX</text><text x="600" y="164" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="800" fill="#00d9ff">DELAY (ms)</text><text x="800" y="164" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="800" fill="#00d9ff">NOTES</text><rect x="40" y="178" width="1120" height="38" rx="9" fill="#0a121b" stroke="#ff3860" stroke-opacity="0.5"/><text x="60" y="202" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">Active Scanner</text><text x="380" y="202" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#ff3860">1,000</text><text x="600" y="202" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12.5" font-weight="400" fill="#8fa3b8">200 (0–10,000)</text><text x="800" y="202" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="400" fill="#8fa3b8">opt-in per run; full audit log</text><rect x="40" y="224" width="1120" height="38" rx="9" fill="#0a121b" stroke="#ffb800" stroke-opacity="0.5"/><text x="60" y="248" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">Content Discovery</text><text x="380" y="248" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#ffb800">1,000</text><text x="600" y="248" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12.5" font-weight="400" fill="#8fa3b8">200 (0–10,000)</text><text x="800" y="248" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="400" fill="#8fa3b8">GET-only, 165-path wordlist</text><rect x="40" y="270" width="1120" height="38" rx="9" fill="#0a121b" stroke="#00d9ff" stroke-opacity="0.5"/><text x="60" y="294" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">Subdomains</text><text x="380" y="294" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#00d9ff">2,000</text><text x="600" y="294" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12.5" font-weight="400" fill="#8fa3b8">100 (0–10,000)</text><text x="800" y="294" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="400" fill="#8fa3b8">DNS via dns.google, 129 prefixes</text><rect x="40" y="316" width="1120" height="38" rx="9" fill="#0a121b" stroke="#ff3ec9" stroke-opacity="0.5"/><text x="60" y="340" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">Custom Rules (active)</text><text x="380" y="340" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#ff3ec9">500</text><text x="600" y="340" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12.5" font-weight="400" fill="#8fa3b8">—</text><text x="800" y="340" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="400" fill="#8fa3b8">same 5,000 ceiling</text><rect x="40" y="362" width="1120" height="38" rx="9" fill="#0a121b" stroke="#ff3ec9" stroke-opacity="0.5"/><text x="60" y="386" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">GraphQL alias batching</text><text x="380" y="386" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#ff3ec9">50 aliases</text><text x="600" y="386" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12.5" font-weight="400" fill="#8fa3b8">—</text><text x="800" y="386" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="400" fill="#8fa3b8">adjustable 2–1,000</text><rect x="40" y="408" width="1120" height="38" rx="9" fill="#0a121b" stroke="#ff3ec9" stroke-opacity="0.5"/><text x="60" y="432" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">GraphQL deep nesting</text><text x="380" y="432" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#ff3ec9">15 levels</text><text x="600" y="432" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12.5" font-weight="400" fill="#8fa3b8">—</text><text x="800" y="432" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="400" fill="#8fa3b8">adjustable 2–500</text><text x="40" y="456" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#8fa3b8">Mutating methods (POST/PUT/PATCH/DELETE) stay off in the Active Scanner unless you switch them on.</text>
</svg>
