<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="XSS tiers">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00d9ff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3b8"/></marker>
    <style>
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes rot { to { transform: rotate(360deg) } }
      @keyframes fall { from { transform: translateY(-260px) } to { transform: translateY(420px) } }
      @keyframes dash { to { stroke-dashoffset: -40 } }
      @keyframes hl { 0%,100% { opacity:0 } 50% { opacity:.35 } }
      .p { animation: pulse 2.4s ease-in-out infinite }
      .d { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite }
      
    </style>
  </defs>
  <rect width="1200" height="320" rx="18" fill="#050810"/>
  <rect width="1200" height="320" rx="18" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="none" stroke="#00d9ff" stroke-opacity="0.28"/>
<text x="40" y="40" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="17" font-weight="800" letter-spacing="1.5" fill="#eaf6ff">XSS SINK DETECTOR — TWO CONFIDENCE TIERS</text><text x="40" y="62" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#8fa3b8">Text-pattern triage. No AST, no data-flow graph.</text><rect x="40" y="80" width="550" height="170" rx="14" fill="#0a121b" stroke="#ff3860" stroke-width="1.4"/><text x="58" y="106" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="800" fill="#ff3860">DIRECT</text><rect x="610" y="80" width="550" height="170" rx="14" fill="#0a121b" stroke="#ffb800" stroke-width="1.4"/><text x="628" y="106" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="800" fill="#ffb800">PROXIMITY</text><text x="60" y="140" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" fill="#eaf6ff">el.innerHTML = <tspan fill="#ff3860">location.hash</tspan></text><text x="60" y="170" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="400" fill="#8fa3b8">Tainted source appears inside the same sink call.</text><text x="60" y="192" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="400" fill="#8fa3b8">Best first stop. Still text matching.</text><text x="630" y="140" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" fill="#eaf6ff"><tspan fill="#ffb800">location.hash</tspan> … a few lines … el.innerHTML</text><text x="630" y="170" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="400" fill="#8fa3b8">Sink within a few lines of a source; no flow claim.</text><text x="630" y="192" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="400" fill="#8fa3b8">Noisy — 'worth a look', not a finding.</text><text x="40" y="285" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#8fa3b8">Sinks: innerHTML · outerHTML · document.write(ln) · insertAdjacentHTML · eval …   Every hit carries the exact line.</text>
</svg>
