nospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="600" fill="#eaf6ff">Analysis**</text><rect x="248.33999999999997" y="226" width="74" height="28" rx="14.0" fill="#00ff9d" opacity="0.12" stroke="#00ff9d" stroke-opacity="0.7"/><text x="285.29499999999996" y="244.2" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="600" fill="#eaf6ff">Roadmap</text><rect x="330.25" y="226" width="67" height="28" rx="14.0" fill="#00ff9d" opacity="0.12" stroke="#00ff9d" stroke-opacity="0.7"/><text x="363.64" y="244.2" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="600" fill="#eaf6ff">Triage</text><rect x="56" y="262" width="67" height="28" rx="14.0" fill="#00ff9d" opacity="0.12" stroke="#00ff9d" stroke-opacity="0.7"/><text x="89.39" y="280.2" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="600" fill="#eaf6ff">Report</text><rect x="440" y="76" width="480" height="290" rx="14" fill="#0a121b" stroke="#ff3860" stroke-width="1.4"/><text x="458" y="102" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="800" fill="#ff3860">SENDS TO TARGET WHEN YOU TRIGGER IT (12)</text><rect x="456" y="118" width="81" height="28" rx="14.0" fill="#ff3860" opacity="0.12" stroke="#ff3860" stroke-opacity="0.7"/><text x="496.52" y="136.2" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="600" fill="#eaf6ff">Repeater</text><rect x="545.04" y="118" width="81" height="28" rx="14.0" fill="#ff3860" opacity="0.12" stroke="#ff3860" stroke-opacity="0.7"/><text x="585.56" y="136.2" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="600" fill="#eaf6ff">Intruder</text><rect x="634.0799999999999" y="118"