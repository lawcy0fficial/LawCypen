roke="#ff3860" stroke-opacity="0.7"/><text x="681.8149999999999" y="208.2" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="600" fill="#eaf6ff">WebSocket Inspector</text><rect x="456" y="226" width="174" height="28" rx="14.0" fill="#ff3860" opacity="0.12" stroke="#ff3860" stroke-opacity="0.7"/><text x="542.865" y="244.2" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="600" fill="#eaf6ff">Custom Rules (active)</text><rect x="637.73" y="226" width="138" height="28" rx="14.0" fill="#ff3860" opacity="0.12" stroke="#ff3860" stroke-opacity="0.7"/><text x="706.77" y="244.2" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="600" fill="#eaf6ff">Scope (Discover)</text><rect x="456" y="262" width="181" height="28" rx="14.0" fill="#ff3860" opacity="0.12" stroke="#ff3860" stroke-opacity="0.7"/><text x="546.43" y="280.2" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="600" fill="#eaf6ff">Session Rules (macros)</text><rect x="940" y="76" width="220" height="290" rx="14" fill="#0a121b" stroke="#ffb800" stroke-width="1.4"/><text x="958" y="102" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="800" fill="#ffb800">THIRD-PARTY (2)</text><rect x="956" y="118" width="95" height="28" rx="14.0" fill="#ffb800" opacity="0.12" stroke="#ffb800" stroke-opacity="0.7"/><text x="1003.65" y="136.2" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="600" fill="#eaf6ff">Subdomains</text><rect x="956" y="154" width="102" height="28" rx="14.0" fill="#ffb800" opacity="0.12" stroke="#ffb800" stroke-opacity="0.7"/><text x="1007.215" y="172.2" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="600" fill="#eaf6ff">AI Analysis</text><text x="956" y="212" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#8fa3b8">→ dns.google, crt.sh</text><text x="956" y="234" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">→ openrouter.ai</text><text x="40" y="400" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">* Match &amp; Replace rules apply to Repeater/Intruder sends; Live Rewrite (declarativeNetRequest) modifies real browser traffic on the inspected tab only.</text><text x="40" y="420" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">** Analysis is passive, except the per-item S3 Check (one GET to s3.amazonaws.com) and Takeover Check (DoH CNAME lookup, then at most one GET).</text><text x="40" y="440" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">Nothing sends until you press a button — with Session Rules macros firing automatically only if you configured a rule.</text>
</svg>
