<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Takeover flow">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00d9ff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3b8"/></marker>
    <style>
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes rot { to { transform: rotate(360deg) } }
      @keyframes fall { from { transform: translateY(-260px) } to { transform: translateY(420px) } }
      @keyframes dash { to { stroke-dashoffset: -40 } }
      @keyframes hl { 0%,100% { opacity:0 } 50% { opacity:.35 } }
      .p { animation: pulse 2.4s ease-in-out infinite }
      .d { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite }
      
    </style>
  </defs>
  <rect width="1200" height="300" rx="18" fill="#050810"/>
  <rect width="1200" height="300" rx="18" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="298" rx="18" fill="none" stroke="#00d9ff" stroke-opacity="0.28"/>
<text x="40" y="40" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="17" font-weight="800" letter-spacing="1.5" fill="#eaf6ff">SUBDOMAIN TAKEOVER CHECK</text><text x="40" y="62" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#8fa3b8">DNS-over-HTTPS CNAME lookup, then at most one GET</text><rect x="40" y="110" width="170" height="80" rx="11" fill="#0a121b" stroke="#00d9ff" stroke-width="1.6"/><rect x="40" y="110" width="170" height="80" rx="11" fill="#00d9ff" opacity="0.06"/><text x="125.0" y="155.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">Hostname</text><rect x="270" y="110" width="190" height="80" rx="11" fill="#0a121b" stroke="#ffb800" stroke-width="1.6"/><rect x="270" y="110" width="190" height="80" rx="11" fill="#ffb800" opacity="0.06"/><text x="365.0" y="144.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">CNAME lookup</text><text x="365.0" y="163.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#ffb800">dns.google</text><rect x="520" y="110" width="220" height="80" rx="11" fill="#0a121b" stroke="#b829ff" stroke-width="1.6"/><rect x="520" y="110" width="220" height="80" rx="11" fill="#b829ff" opacity="0.06"/><text x="630.0" y="144.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">Known dangling suffix?</text><text x="630.0" y="163.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#b829ff">boundary-checked</text><rect x="800" y="60" width="240" height="70" rx="11" fill="#0a121b" stroke="#ff3860" stroke-width="1.6"/><rect x="800" y="60" width="240" height="70" rx="11" fill="#ff3860" opacity="0.06"/><text x="920.0" y="89.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="700" fill="#eaf6ff">Fingerprint GET</text><text x="920.0" y="108.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#ff3860">GitHub Pages · Heroku verified</text><rect x="800" y="170" width="240" height="70" rx="11" fill="#0a121b" stroke="#ffb800" stroke-width="1.6"/><rect x="800" y="170" width="240" height="70" rx="11" fill="#ffb800" opacity="0.06"/><text x="920.0" y="199.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="700" fill="#eaf6ff">manual-check-needed</text><text x="920.0" y="218.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#ffb800">Azure · Fastly · Netlify …</text><line x1="210" y1="150" x2="270" y2="150" stroke="#00d9ff" stroke-width="1.7" class="d" marker-end="url(#arr)"/><line x1="460" y1="150" x2="520" y2="150" stroke="#ffb800" stroke-width="1.7" class="d" marker-end="url(#arr)"/><line x1="740" y1="130" x2="800" y2="95" stroke="#ff3860" stroke-width="1.7" class="d" marker-end="url(#arr)"/><line x1="740" y1="170" x2="800" y2="205" stroke="#ffb800" stroke-width="1.7" class="d" marker-end="url(#arr)"/><text x="40" y="278" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#8fa3b8">Nothing is registered or claimed. Honest 'go look' beats a confidently wrong verdict.</text>
</svg>
