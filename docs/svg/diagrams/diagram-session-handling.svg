<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Session handling flow">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00d9ff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3b8"/></marker>
    <style>
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes rot { to { transform: rotate(360deg) } }
      @keyframes fall { from { transform: translateY(-260px) } to { transform: translateY(420px) } }
      @keyframes dash { to { stroke-dashoffset: -40 } }
      @keyframes hl { 0%,100% { opacity:0 } 50% { opacity:.35 } }
      .p { animation: pulse 2.4s ease-in-out infinite }
      .d { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite }
      
    </style>
  </defs>
  <rect width="1200" height="330" rx="18" fill="#050810"/>
  <rect width="1200" height="330" rx="18" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="328" rx="18" fill="none" stroke="#00d9ff" stroke-opacity="0.28"/>
<text x="40" y="40" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="17" font-weight="800" letter-spacing="1.5" fill="#eaf6ff">SESSION HANDLING RULES — AUTO RE-AUTHENTICATION</text><text x="40" y="62" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#8fa3b8">Shared repeaterSend() chokepoint: Repeater · Intruder · Workflows</text><rect x="40" y="130" width="170" height="80" rx="11" fill="#0a121b" stroke="#00d9ff" stroke-width="1.6"/><rect x="40" y="130" width="170" height="80" rx="11" fill="#00d9ff" opacity="0.06"/><text x="125.0" y="175.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">Send request</text><rect x="270" y="130" width="190" height="80" rx="11" fill="#0a121b" stroke="#ffb800" stroke-width="1.6"/><rect x="270" y="130" width="190" height="80" rx="11" fill="#ffb800" opacity="0.06"/><text x="365.0" y="164.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">Response looks expired?</text><text x="365.0" y="183.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#ffb800">status / body regex</text><rect x="540" y="60" width="200" height="80" rx="11" fill="#0a121b" stroke="#b829ff" stroke-width="1.6"/><rect x="540" y="60" width="200" height="80" rx="11" fill="#b829ff" opacity="0.06"/><text x="640.0" y="94.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">Run macro</text><text x="640.0" y="113.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#b829ff">saved login request</text><rect x="540" y="200" width="200" height="80" rx="11" fill="#0a121b" stroke="#00ff9d" stroke-width="1.6"/><rect x="540" y="200" width="200" height="80" rx="11" fill="#00ff9d" opacity="0.06"/><text x="640.0" y="234.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">Continue</text><text x="640.0" y="253.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#00ff9d">return response</text><rect x="810" y="60" width="190" height="80" rx="11" fill="#0a121b" stroke="#ff3ec9" stroke-width="1.6"/><rect x="810" y="60" width="190" height="80" rx="11" fill="#ff3ec9" opacity="0.06"/><text x="905.0" y="94.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">Extract values</text><text x="905.0" y="113.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#ff3ec9">Set-Cookie · header · regex</text><rect x="1050" y="60" width="120" height="80" rx="11" fill="#0a121b" stroke="#00ff9d" stroke-width="1.6"/><rect x="1050" y="60" width="120" height="80" rx="11" fill="#00ff9d" opacity="0.06"/><text x="1110.0" y="105.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">Retry once</text><line x1="210" y1="170" x2="270" y2="170" stroke="#00d9ff" stroke-width="1.7" class="d" marker-end="url(#arr)"/><line x1="460" y1="150" x2="540" y2="100" stroke="#ffb800" stroke-width="1.7" class="d" marker-end="url(#arr)"/><line x1="460" y1="190" x2="540" y2="240" stroke="#00ff9d" stroke-width="1.7" class="d" marker-end="url(#arr)"/><line x1="740" y1="100" x2="810" y2="100" stroke="#b829ff" stroke-width="1.7" class="d" marker-end="url(#arr)"/><line x1="1000" y1="100" x2="1050" y2="100" stroke="#ff3ec9" stroke-width="1.7" class="d" marker-end="url(#arr)"/><text x="478" y="108" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#ffb800">yes</text><text x="478" y="232" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#00ff9d">no</text><circle r="5" fill="#ffb800" filter="url(#glow)"><animateMotion dur="5s" begin="0s" repeatCount="indefinite" path="M210 170 L270 170 L460 150 L540 100 L740 100 L810 100 L1000 100 L1050 100"/></circle><text x="40" y="308" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#8fa3b8">Modes: run macro before every request, or only when the response looks like the session expired.</text>
</svg>
