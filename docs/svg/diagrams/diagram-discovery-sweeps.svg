<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Discovery sweeps">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00d9ff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3b8"/></marker>
    <style>
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes rot { to { transform: rotate(360deg) } }
      @keyframes fall { from { transform: translateY(-260px) } to { transform: translateY(420px) } }
      @keyframes dash { to { stroke-dashoffset: -40 } }
      @keyframes hl { 0%,100% { opacity:0 } 50% { opacity:.35 } }
      .p { animation: pulse 2.4s ease-in-out infinite }
      .d { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite }
      
    </style>
  </defs>
  <rect width="1200" height="300" rx="18" fill="#050810"/>
  <rect width="1200" height="300" rx="18" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="298" rx="18" fill="none" stroke="#00d9ff" stroke-opacity="0.28"/>
<text x="40" y="40" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="17" font-weight="800" letter-spacing="1.5" fill="#eaf6ff">DISCOVERY — THREE DIFFERENT SWEEPS</text><text x="40" y="62" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#8fa3b8">Different tools, different scale, different destination</text><rect x="40" y="80" width="360" height="180" rx="14" fill="#0a121b" stroke="#00ff9d" stroke-width="1.5"/><text x="60" y="112" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="15" font-weight="800" fill="#00ff9d">Scope → Discover</text><text x="60" y="146" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12.5" font-weight="400" fill="#eaf6ff">16 fixed paths, once per click</text><text x="60" y="176" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">robots.txt · sitemap.xml · .git/HEAD · .env · </text><text x="60" y="194" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">Swagger · health</text><rect x="420" y="80" width="360" height="180" rx="14" fill="#0a121b" stroke="#ffb800" stroke-width="1.5"/><text x="440" y="112" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="15" font-weight="800" fill="#ffb800">Content Discovery</text><text x="440" y="146" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12.5" font-weight="400" fill="#eaf6ff">165-path wordlist, GET-only</text><text x="440" y="176" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">sort by interest · hide soft-404s · rate-limit</text><text x="440" y="194" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">ed</text><rect x="800" y="80" width="360" height="180" rx="14" fill="#0a121b" stroke="#00d9ff" stroke-width="1.5"/><text x="820" y="112" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="15" font-weight="800" fill="#00d9ff">Subdomains</text><text x="820" y="146" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12.5" font-weight="400" fill="#eaf6ff">129 DNS prefixes + CT search</text><text x="820" y="176" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">dns.google + crt.sh — never touches target HTT</text><text x="820" y="194" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">P</text>
</svg>
