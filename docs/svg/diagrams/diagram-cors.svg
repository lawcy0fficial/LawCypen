<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="CORS">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00d9ff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3b8"/></marker>
    <style>
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes rot { to { transform: rotate(360deg) } }
      @keyframes fall { from { transform: translateY(-260px) } to { transform: translateY(420px) } }
      @keyframes dash { to { stroke-dashoffset: -40 } }
      @keyframes hl { 0%,100% { opacity:0 } 50% { opacity:.35 } }
      .p { animation: pulse 2.4s ease-in-out infinite }
      .d { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite }
      
    </style>
  </defs>
  <rect width="1200" height="300" rx="18" fill="#050810"/>
  <rect width="1200" height="300" rx="18" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="298" rx="18" fill="none" stroke="#00d9ff" stroke-opacity="0.28"/>
<text x="40" y="40" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="17" font-weight="800" letter-spacing="1.5" fill="#eaf6ff">CORS FINDINGS</text><text x="40" y="62" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#8fa3b8">Most serious when combined with Allow-Credentials: true</text><rect x="40" y="90" width="360" height="80" rx="11" fill="#0a121b" stroke="#ffb800" stroke-width="1.6"/><rect x="40" y="90" width="360" height="80" rx="11" fill="#ffb800" opacity="0.06"/><text x="220.0" y="124.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">Wildcard origin</text><text x="220.0" y="143.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#ffb800">Access-Control-Allow-Origin: *</text><rect x="420" y="90" width="360" height="80" rx="11" fill="#0a121b" stroke="#ffb800" stroke-width="1.6"/><rect x="420" y="90" width="360" height="80" rx="11" fill="#ffb800" opacity="0.06"/><text x="600.0" y="124.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">null origin allowed</text><text x="600.0" y="143.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#ffb800">Access-Control-Allow-Origin: null</text><rect x="800" y="90" width="360" height="80" rx="11" fill="#0a121b" stroke="#ff3860" stroke-width="1.6"/><rect x="800" y="90" width="360" height="80" rx="11" fill="#ff3860" opacity="0.06"/><text x="980.0" y="124.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">Origin reflection</text><text x="980.0" y="143.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#ff3860">server echoes the request Origin</text><rect x="40" y="200" width="1120" height="60" rx="11" fill="#0a121b" stroke="#ff3860" stroke-width="1.6"/><rect x="40" y="200" width="1120" height="60" rx="11" fill="#ff3860" opacity="0.06"/><text x="600.0" y="235.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="15" font-weight="700" fill="#eaf6ff">+ Access-Control-Allow-Credentials: true  →  cross-origin account-takeover primitive</text>
</svg>
