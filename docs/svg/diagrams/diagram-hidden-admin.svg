<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Hidden admin">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00d9ff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3b8"/></marker>
    <style>
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes rot { to { transform: rotate(360deg) } }
      @keyframes fall { from { transform: translateY(-260px) } to { transform: translateY(420px) } }
      @keyframes dash { to { stroke-dashoffset: -40 } }
      @keyframes hl { 0%,100% { opacity:0 } 50% { opacity:.35 } }
      .p { animation: pulse 2.4s ease-in-out infinite }
      .d { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite }
      
    </style>
  </defs>
  <rect width="1200" height="280" rx="18" fill="#050810"/>
  <rect width="1200" height="280" rx="18" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="278" rx="18" fill="none" stroke="#00d9ff" stroke-opacity="0.28"/>
<text x="40" y="40" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="17" font-weight="800" letter-spacing="1.5" fill="#eaf6ff">HIDDEN ADMIN ROUTES</text><text x="40" y="62" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#8fa3b8">Admin-shaped endpoint templates the app never actually requested</text><rect x="40" y="110" width="240" height="84" rx="11" fill="#0a121b" stroke="#00d9ff" stroke-width="1.6"/><rect x="40" y="110" width="240" height="84" rx="11" fill="#00d9ff" opacity="0.06"/><text x="160.0" y="146.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">Endpoint inventory</text><text x="160.0" y="165.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#00d9ff">from scripts, specs, JSON</text><rect x="360" y="110" width="260" height="84" rx="11" fill="#0a121b" stroke="#ffb800" stroke-width="1.6"/><rect x="360" y="110" width="260" height="84" rx="11" fill="#ffb800" opacity="0.06"/><text x="490.0" y="146.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">Looks admin-shaped?</text><text x="490.0" y="165.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#ffb800">path pattern match</text><rect x="700" y="110" width="220" height="84" rx="11" fill="#0a121b" stroke="#ffb800" stroke-width="1.6"/><rect x="700" y="110" width="220" height="84" rx="11" fill="#ffb800" opacity="0.06"/><text x="810.0" y="146.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">Ever requested?</text><text x="810.0" y="165.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#ffb800">everRequested flag</text><rect x="990" y="110" width="170" height="84" rx="11" fill="#0a121b" stroke="#ff3860" stroke-width="1.6"/><rect x="990" y="110" width="170" height="84" rx="11" fill="#ff3860" opacity="0.06"/><text x="1075.0" y="146.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">Candidate</text><text x="1075.0" y="165.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#ff3860">test access control</text><line x1="280" y1="152" x2="360" y2="152" stroke="#00d9ff" stroke-width="1.7" class="d" marker-end="url(#arr)"/><line x1="620" y1="152" x2="700" y2="152" stroke="#ffb800" stroke-width="1.7" class="d" marker-end="url(#arr)"/><line x1="920" y1="152" x2="990" y2="152" stroke="#ff3860" stroke-width="1.7" class="d" marker-end="url(#arr)"/><text x="955" y="218" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#ff3860">never requested</text><circle r="5" fill="#ffb800" filter="url(#glow)"><animateMotion dur="5s" begin="0s" repeatCount="indefinite" path="M40 152 L1160 152"/></circle>
</svg>
