<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="JWT checks">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00d9ff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3b8"/></marker>
    <style>
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes rot { to { transform: rotate(360deg) } }
      @keyframes fall { from { transform: translateY(-260px) } to { transform: translateY(420px) } }
      @keyframes dash { to { stroke-dashoffset: -40 } }
      @keyframes hl { 0%,100% { opacity:0 } 50% { opacity:.35 } }
      .p { animation: pulse 2.4s ease-in-out infinite }
      .d { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite }
      
    </style>
  </defs>
  <rect width="1200" height="400" rx="18" fill="#050810"/>
  <rect width="1200" height="400" rx="18" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="398" rx="18" fill="none" stroke="#00d9ff" stroke-opacity="0.28"/>
<text x="40" y="40" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="17" font-weight="800" letter-spacing="1.5" fill="#eaf6ff">JWT ANALYZER — 7 PASSIVE CHECKS</text><text x="40" y="62" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#8fa3b8">Decodes base64url header + payload. Never cracks or forges.</text><rect x="40" y="84" width="270" height="92" rx="12" fill="#0a121b" stroke="#ff3860" stroke-width="1.3"/><text x="54" y="108" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">alg = none</text><rect x="236" y="93" width="60" height="20" rx="10" fill="#ff3860" opacity="0.18" stroke="#ff3860"/><text x="266" y="107" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10" font-weight="800" fill="#ff3860">HIGH</text><text x="54" y="130" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">Server may accept unsigned tokens</text><rect x="325" y="84" width="270" height="92" rx="12" fill="#0a121b" stroke="#ffb800" stroke-width="1.3"/><text x="339" y="108" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">No exp claim</text><rect x="521" y="93" width="60" height="20" rx="10" fill="#ffb800" opacity="0.18" stroke="#ffb800"/><text x="551" y="107" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10" font-weight="800" fill="#ffb800">MEDIUM</text><text x="339" y="130" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">Token may never expire</text><rect x="610" y="84" width="270" height="92" rx="12" fill="#0a121b" stroke="#00d9ff" stroke-width="1.3"/><text x="624" y="108" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">Long lifetime</text><rect x="806" y="93" width="60" height="20" rx="10" fill="#00d9ff" opacity="0.18" stroke="#00d9ff"/><text x="836" y="107" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10" font-weight="800" fill="#00d9ff">LOW</text><text x="624" y="130" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">Reports approximate hours</text><rect x="895" y="84" width="270" height="92" rx="12" fill="#0a121b" stroke="#00d9ff" stroke-width="1.3"/><text x="909" y="108" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">Asymmetric alg, no kid</text><rect x="1091" y="93" width="60" height="20" rx="10" fill="#00d9ff" opacity="0.18" stroke="#00d9ff"/><text x="1121" y="107" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10" font-weight="800" fill="#00d9ff">LOW</text><text x="909" y="130" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">Key rotation path unclear</text><rect x="40" y="194" width="270" height="92" rx="12" fill="#0a121b" stroke="#00d9ff" stroke-width="1.3"/><text x="54" y="218" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">Symmetric algorithm</text><rect x="236" y="203" width="60" height="20" rx="10" fill="#8fa3b8" opacity="0.18" stroke="#8fa3b8"/><text x="266" y="217" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10" font-weight="800" fill="#8fa3b8">INFO</text><text x="54" y="240" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">Weak/leaked secret allows forging</text><rect x="325" y="194" width="270" height="92" rx="12" fill="#0a121b" stroke="#00d9ff" stroke-width="1.3"/><text x="339" y="218" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">Token already expired</text><rect x="521" y="203" width="60" height="20" rx="10" fill="#8fa3b8" opacity="0.18" stroke="#8fa3b8"/><text x="551" y="217" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10" font-weight="800" fill="#8fa3b8">INFO</text><text x="339" y="240" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">Noted for context</text><rect x="610" y="194" width="270" height="92" rx="12" fill="#0a121b" stroke="#00d9ff" stroke-width="1.3"/><text x="624" y="218" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">Authz-relevant claims</text><rect x="806" y="203" width="60" height="20" rx="10" fill="#8fa3b8" opacity="0.18" stroke="#8fa3b8"/><text x="836" y="217" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10" font-weight="800" fill="#8fa3b8">INFO</text><text x="624" y="240" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">Good tamper / role-replay targets</text><rect x="895" y="194" width="270" height="92" rx="11" fill="#0a121b" stroke="#00ff9d" stroke-width="1.6"/><rect x="895" y="194" width="270" height="92" rx="11" fill="#00ff9d" opacity="0.06"/><text x="1030.0" y="234.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">Next: JWT Editor</text><text x="1030.0" y="253.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#00ff9d">re-sign · weak-secret check</text><text x="40" y="360" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#8fa3b8">Then use JWT Editor: decode → edit claims → re-sign (none / HS256 / HS384 / HS512) → copy as Bearer.</text><text x="40" y="380" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#8fa3b8">Weak-secret check tries 62 common/default HMAC secrets locally — offline, never contacts the target.</text>
</svg>
