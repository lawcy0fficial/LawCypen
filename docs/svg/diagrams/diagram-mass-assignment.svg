<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Mass assignment">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00d9ff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3b8"/></marker>
    <style>
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes rot { to { transform: rotate(360deg) } }
      @keyframes fall { from { transform: translateY(-260px) } to { transform: translateY(420px) } }
      @keyframes dash { to { stroke-dashoffset: -40 } }
      @keyframes hl { 0%,100% { opacity:0 } 50% { opacity:.35 } }
      .p { animation: pulse 2.4s ease-in-out infinite }
      .d { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite }
      
    </style>
  </defs>
  <rect width="1200" height="320" rx="18" fill="#050810"/>
  <rect width="1200" height="320" rx="18" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="none" stroke="#00d9ff" stroke-opacity="0.28"/>
<text x="40" y="40" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="17" font-weight="800" letter-spacing="1.5" fill="#eaf6ff">MASS ASSIGNMENT — SHAPE DIFF</text><text x="40" y="62" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#8fa3b8">Request body vs response body for the same call</text><rect x="40" y="80" width="360" height="190" rx="14" fill="#0a121b" stroke="#00d9ff" stroke-width="1.4"/><text x="58" y="106" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="800" fill="#00d9ff">REQUEST</text><rect x="430" y="80" width="360" height="190" rx="14" fill="#0a121b" stroke="#00ff9d" stroke-width="1.4"/><text x="448" y="106" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="800" fill="#00ff9d">RESPONSE</text><rect x="440" y="140" width="340" height="52" rx="6" fill="#ff3860" opacity="0.16" style="animation: hl 2s ease-in-out infinite"/><text x="60" y="130" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="400" fill="#eaf6ff">{ "name": "Ava",</text><text x="60" y="154" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="400" fill="#eaf6ff">  "email": "a@x.io" }</text><text x="450" y="130" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="400" fill="#eaf6ff">{ "name": "Ava",</text><text x="450" y="154" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="400" fill="#eaf6ff">  "email": "a@x.io",</text><text x="450" y="178" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="400" fill="#ff3860">  "role": "user",</text><text x="450" y="202" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="400" fill="#ff3860">  "balance": 0 }</text><rect x="830" y="110" width="330" height="120" rx="11" fill="#0a121b" stroke="#ff3860" stroke-width="1.6"/><rect x="830" y="110" width="330" height="120" rx="11" fill="#ff3860" opacity="0.06"/><text x="995.0" y="164.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">Lead: try sending role / balance</text><text x="995.0" y="183.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#ff3860">fields returned but never sent, with sensitive names</text><line x1="790" y1="170" x2="830" y2="170" stroke="#ff3860" stroke-width="1.7" class="d" marker-end="url(#arr)"/><text x="40" y="300" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">Also flags sensitive names the client already sends (role, isAdmin, price, verified, owner_id …) so you can test server enforcement.</text>
</svg>
