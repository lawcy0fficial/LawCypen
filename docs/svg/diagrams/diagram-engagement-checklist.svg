<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Engagement checklist">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00d9ff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3b8"/></marker>
    <style>
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes rot { to { transform: rotate(360deg) } }
      @keyframes fall { from { transform: translateY(-260px) } to { transform: translateY(420px) } }
      @keyframes dash { to { stroke-dashoffset: -40 } }
      @keyframes hl { 0%,100% { opacity:0 } 50% { opacity:.35 } }
      .p { animation: pulse 2.4s ease-in-out infinite }
      .d { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite }
      
    </style>
  </defs>
  <rect width="1200" height="400" rx="18" fill="#050810"/>
  <rect width="1200" height="400" rx="18" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="398" rx="18" fill="none" stroke="#00d9ff" stroke-opacity="0.28"/>
<text x="40" y="40" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="17" font-weight="800" letter-spacing="1.5" fill="#eaf6ff">ENGAGEMENT CHECKLIST</text><text x="40" y="62" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#8fa3b8">Before · during · after</text><rect x="40" y="80" width="360" height="290" rx="14" fill="#0a121b" stroke="#00d9ff" stroke-width="1.5"/><text x="60" y="112" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="15" font-weight="800" fill="#00d9ff">BEFORE</text><circle cx="68" cy="146" r="7" fill="none" stroke="#00d9ff" stroke-width="1.6"/><path d="M64 146 l3 3 l5 -6" stroke="#00d9ff" stroke-width="1.8" fill="none" class="p" style="animation-delay:0.0s"/><text x="86" y="151" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="400" fill="#eaf6ff">Written authorization in hand</text><circle cx="68" cy="188" r="7" fill="none" stroke="#00d9ff" stroke-width="1.6"/><path d="M64 188 l3 3 l5 -6" stroke="#00d9ff" stroke-width="1.8" fill="none" class="p" style="animation-delay:0.25s"/><text x="86" y="193" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="400" fill="#eaf6ff">Targets added in Scope only</text><circle cx="68" cy="230" r="7" fill="none" stroke="#00d9ff" stroke-width="1.6"/><path d="M64 230 l3 3 l5 -6" stroke="#00d9ff" stroke-width="1.8" fill="none" class="p" style="animation-delay:0.5s"/><text x="86" y="235" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="400" fill="#eaf6ff">Exclude analytics / CDNs</text><circle cx="68" cy="272" r="7" fill="none" stroke="#00d9ff" stroke-width="1.6"/><path d="M64 272 l3 3 l5 -6" stroke="#00d9ff" stroke-width="1.8" fill="none" class="p" style="animation-delay:0.75s"/><text x="86" y="277" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="400" fill="#eaf6ff">Role Sessions saved (if testing authz)</text><circle cx="68" cy="314" r="7" fill="none" stroke="#00d9ff" stroke-width="1.6"/><path d="M64 314 l3 3 l5 -6" stroke="#00d9ff" stroke-width="1.8" fill="none" class="p" style="animation-delay:1.0s"/><text x="86" y="319" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="400" fill="#eaf6ff">Rate limits + request ceilings chosen</text><rect x="420" y="80" width="360" height="290" rx="14" fill="#0a121b" stroke="#ffb800" stroke-width="1.5"/><text x="440" y="112" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="15" font-weight="800" fill="#ffb800">DURING</text><circle cx="448" cy="146" r="7" fill="none" stroke="#ffb800" stroke-width="1.6"/><path d="M444 146 l3 3 l5 -6" stroke="#ffb800" stroke-width="1.8" fill="none" class="p" style="animation-delay:0.0s"/><text x="466" y="151" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="400" fill="#eaf6ff">Browse first — let passive analyzers work</text><circle cx="448" cy="188" r="7" fill="none" stroke="#ffb800" stroke-width="1.6"/><path d="M444 188 l3 3 l5 -6" stroke="#ffb800" stroke-width="1.8" fill="none" class="p" style="animation-delay:0.25s"/><text x="466" y="193" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="400" fill="#eaf6ff">Review Analysis sub-tabs by count</text><circle cx="448" cy="230" r="7" fill="none" stroke="#ffb800" stroke-width="1.6"/><path d="M444 230 l3 3 l5 -6" stroke="#ffb800" stroke-width="1.8" fill="none" class="p" style="animation-delay:0.5s"/><text x="466" y="235" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="400" fill="#eaf6ff">Verify heuristics by hand in Repeater</text><circle cx="448" cy="272" r="7" fill="none" stroke="#ffb800" stroke-width="1.6"/><path d="M444 272 l3 3 l5 -6" stroke="#ffb800" stroke-width="1.8" fill="none" class="p" style="animation-delay:0.75s"/><text x="466" y="277" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="400" fill="#eaf6ff">Mark status in Triage as you go</text><circle cx="448" cy="314" r="7" fill="none" stroke="#ffb800" stroke-width="1.6"/><path d="M444 314 l3 3 l5 -6" stroke="#ffb800" stroke-width="1.8" fill="none" class="p" style="animation-delay:1.0s"/><text x="466" y="319" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="400" fill="#eaf6ff">Snapshot the endpoint inventory</text><rect x="800" y="80" width="360" height="290" rx="14" fill="#0a121b" stroke="#00ff9d" stroke-width="1.5"/><text x="820" y="112" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="15" font-weight="800" fill="#00ff9d">AFTER</text><circle cx="828" cy="146" r="7" fill="none" stroke="#00ff9d" stroke-width="1.6"/><path d="M824 146 l3 3 l5 -6" stroke="#00ff9d" stroke-width="1.8" fill="none" class="p" style="animation-delay:0.0s"/><text x="846" y="151" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="400" fill="#eaf6ff">Score confirmed findings with CVSS</text><circle cx="828" cy="188" r="7" fill="none" stroke="#00ff9d" stroke-width="1.6"/><path d="M824 188 l3 3 l5 -6" stroke="#00ff9d" stroke-width="1.8" fill="none" class="p" style="animation-delay:0.25s"/><text x="846" y="193" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="400" fill="#eaf6ff">Export HTML / Markdown / Issues / SARIF</text><circle cx="828" cy="230" r="7" fill="none" stroke="#00ff9d" stroke-width="1.6"/><path d="M824 230 l3 3 l5 -6" stroke="#00ff9d" stroke-width="1.8" fill="none" class="p" style="animation-delay:0.5s"/><text x="846" y="235" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="400" fill="#eaf6ff">Save Project for the record</text><circle cx="828" cy="272" r="7" fill="none" stroke="#00ff9d" stroke-width="1.6"/><path d="M824 272 l3 3 l5 -6" stroke="#00ff9d" stroke-width="1.8" fill="none" class="p" style="animation-delay:0.75s"/><text x="846" y="277" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="400" fill="#eaf6ff">Rotate any keys exposed in chats</text><circle cx="828" cy="314" r="7" fill="none" stroke="#00ff9d" stroke-width="1.6"/><path d="M824 314 l3 3 l5 -6" stroke="#00ff9d" stroke-width="1.8" fill="none" class="p" style="animation-delay:1.0s"/><text x="846" y="319" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="400" fill="#eaf6ff">Retest with the Regression Suite</text>
