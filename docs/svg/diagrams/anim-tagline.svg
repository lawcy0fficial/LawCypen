<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" width="1200" height="90" role="img" aria-label="Tagline">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00d9ff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3b8"/></marker>
    <style>
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes rot { to { transform: rotate(360deg) } }
      @keyframes fall { from { transform: translateY(-260px) } to { transform: translateY(420px) } }
      @keyframes dash { to { stroke-dashoffset: -40 } }
      @keyframes hl { 0%,100% { opacity:0 } 50% { opacity:.35 } }
      .p { animation: pulse 2.4s ease-in-out infinite }
      .d { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite }
      
    </style>
  </defs>
  <rect width="1200" height="90" rx="18" fill="#050810"/>
  <rect width="1200" height="90" rx="18" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="88" rx="18" fill="none" stroke="#00d9ff" stroke-opacity="0.28"/>
<text x="600.0" y="55" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="26" font-weight="800" fill="#00ff9d" opacity="0">Capture. Repeat. Intrude. Analyze. Report.<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="18s" begin="0s" repeatCount="indefinite"/></text><text x="600.0" y="55" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="26" font-weight="800" fill="#00d9ff" opacity="0">Burp-style workflow — zero proxy setup.<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="18s" begin="6s" repeatCount="indefinite"/></text><text x="600.0" y="55" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="26" font-weight="800" fill="#ffb800" opacity="0">Authorized scope only.<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="18s" begin="12s" repeatCount="indefinite"/></text>
</svg>
