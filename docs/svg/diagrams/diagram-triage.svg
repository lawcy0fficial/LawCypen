<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Triage statuses">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00d9ff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3b8"/></marker>
    <style>
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes rot { to { transform: rotate(360deg) } }
      @keyframes fall { from { transform: translateY(-260px) } to { transform: translateY(420px) } }
      @keyframes dash { to { stroke-dashoffset: -40 } }
      @keyframes hl { 0%,100% { opacity:0 } 50% { opacity:.35 } }
      .p { animation: pulse 2.4s ease-in-out infinite }
      .d { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite }
      
    </style>
  </defs>
  <rect width="1200" height="300" rx="18" fill="#050810"/>
  <rect width="1200" height="300" rx="18" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="298" rx="18" fill="none" stroke="#00d9ff" stroke-opacity="0.28"/>
<text x="40" y="40" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="17" font-weight="800" letter-spacing="1.5" fill="#eaf6ff">TRIAGE STATUSES</text><text x="40" y="62" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#8fa3b8">One list across every analyzer, Custom Rules, and Active Scanner</text><rect x="40.0" y="90" width="210.0" height="170" rx="12" fill="#0a121b" stroke="#00d9ff" stroke-opacity="0.7"/><text x="145.0" y="116" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12.5" font-weight="800" fill="#00d9ff">NEW</text><rect x="54.0" y="136" width="182.0" height="26" rx="6" fill="#00d9ff" opacity="0.14" style="animation: pulse 2.0s ease-in-out infinite"/><rect x="54.0" y="172" width="182.0" height="26" rx="6" fill="#00d9ff" opacity="0.14" style="animation: pulse 2.4s ease-in-out infinite"/><rect x="54.0" y="208" width="182.0" height="26" rx="6" fill="#00d9ff" opacity="0.14" style="animation: pulse 2.8s ease-in-out infinite"/><rect x="264.0" y="90" width="210.0" height="170" rx="12" fill="#0a121b" stroke="#ff3860" stroke-opacity="0.7"/><text x="369.0" y="116" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12.5" font-weight="800" fill="#ff3860">CONFIRMED</text><rect x="278.0" y="136" width="182.0" height="26" rx="6" fill="#ff3860" opacity="0.14" style="animation: pulse 2.0s ease-in-out infinite"/><rect x="278.0" y="172" width="182.0" height="26" rx="6" fill="#ff3860" opacity="0.14" style="animation: pulse 2.4s ease-in-out infinite"/><rect x="278.0" y="208" width="182.0" height="26" rx="6" fill="#ff3860" opacity="0.14" style="animation: pulse 2.8s ease-in-out infinite"/><rect x="488.0" y="90" width="210.0" height="170" rx="12" fill="#0a121b" stroke="#8fa3b8" stroke-opacity="0.7"/><text x="593.0" y="116" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12.5" font-weight="800" fill="#8fa3b8">FALSE POSITIVE</text><rect x="502.0" y="136" width="182.0" height="26" rx="6" fill="#8fa3b8" opacity="0.14" style="animation: pulse 2.0s ease-in-out infinite"/><rect x="502.0" y="172" width="182.0" height="26" rx="6" fill="#8fa3b8" opacity="0.14" style="animation: pulse 2.4s ease-in-out infinite"/><rect x="712.0" y="90" width="210.0" height="170" rx="12" fill="#0a121b" stroke="#00ff9d" stroke-opacity="0.7"/><text x="817.0" y="116" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12.5" font-weight="800" fill="#00ff9d">FIXED</text><rect x="726.0" y="136" width="182.0" height="26" rx="6" fill="#00ff9d" opacity="0.14" style="animation: pulse 2.0s ease-in-out infinite"/><rect x="726.0" y="172" width="182.0" height="26" rx="6" fill="#00ff9d" opacity="0.14" style="animation: pulse 2.4s ease-in-out infinite"/><rect x="936.0" y="90" width="210.0" height="170" rx="12" fill="#0a121b" stroke="#b829ff" stroke-opacity="0.7"/><text x="1041.0" y="116" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12.5" font-weight="800" fill="#b829ff">REPORTED</text><rect x="950.0" y="136" width="182.0" height="26" rx="6" fill="#b829ff" opacity="0.14" style="animation: pulse 2.0s ease-in-out infinite"/><rect x="950.0" y="172" width="182.0" height="26" rx="6" fill="#b829ff" opacity="0.14" style="animation: pulse 2.4s ease-in-out infinite"/>
