<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Intruder anatomy">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00d9ff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3b8"/></marker>
    <style>
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes rot { to { transform: rotate(360deg) } }
      @keyframes fall { from { transform: translateY(-260px) } to { transform: translateY(420px) } }
      @keyframes dash { to { stroke-dashoffset: -40 } }
      @keyframes hl { 0%,100% { opacity:0 } 50% { opacity:.35 } }
      .p { animation: pulse 2.4s ease-in-out infinite }
      .d { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite }
      
    </style>
  </defs>
  <rect width="1200" height="470" rx="18" fill="#050810"/>
  <rect width="1200" height="470" rx="18" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="468" rx="18" fill="none" stroke="#00d9ff" stroke-opacity="0.28"/>
<text x="40" y="40" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="17" font-weight="800" letter-spacing="1.5" fill="#eaf6ff">INTRUDER — FROM POSITIONS TO RESULTS</text><text x="40" y="62" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#8fa3b8">Sub-tabs: Target · Positions · Payloads · Options</text><rect x="40" y="84" width="270" height="340" rx="14" fill="#0a121b" stroke="#00d9ff" stroke-width="1.5"/><text x="56" y="112" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="800" fill="#00d9ff">POSITIONS</text><circle cx="62" cy="146" r="4" fill="#00d9ff" class="p" style="animation-delay:0.0s"/><text x="76" y="150" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#eaf6ff">Mark with §payload§</text><circle cx="62" cy="190" r="4" fill="#00d9ff" class="p" style="animation-delay:0.25s"/><text x="76" y="194" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#eaf6ff">Add § / Clear § / Auto § / Refresh</text><circle cx="62" cy="234" r="4" fill="#00d9ff" class="p" style="animation-delay:0.5s"/><text x="76" y="238" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#eaf6ff">Live position + length counters</text><circle cx="62" cy="278" r="4" fill="#00d9ff" class="p" style="animation-delay:0.75s"/><text x="76" y="282" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#eaf6ff">Target read from the request itself</text><rect x="325" y="84" width="270" height="340" rx="14" fill="#0a121b" stroke="#ffb800" stroke-width="1.5"/><text x="341" y="112" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="800" fill="#ffb800">PAYLOAD SETS 1–3</text><circle cx="347" cy="146" r="4" fill="#ffb800" class="p" style="animation-delay:0.0s"/><text x="361" y="150" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#eaf6ff">Paste or load a wordlist (save too)</text><circle cx="347" cy="190" r="4" fill="#ffb800" class="p" style="animation-delay:0.25s"/><text x="361" y="194" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#eaf6ff">Numbers: start, end, step</text><circle cx="347" cy="234" r="4" fill="#ffb800" class="p" style="animation-delay:0.5s"/><text x="361" y="238" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#eaf6ff">Dates: daily, YYYY-MM-DD</text><circle cx="347" cy="278" r="4" fill="#ffb800" class="p" style="animation-delay:0.75s"/><text x="361" y="282" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#eaf6ff">Seq: pattern with {n}</text><rect x="610" y="84" width="270" height="340" rx="14" fill="#0a121b" stroke="#b829ff" stroke-width="1.5"/><text x="626" y="112" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="800" fill="#b829ff">PROCESSING (in order)</text><circle cx="632" cy="146" r="4" fill="#b829ff" class="p" style="animation-delay:0.0s"/><text x="646" y="150" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#eaf6ff">Prefix · suffix</text><circle cx="632" cy="190" r="4" fill="#b829ff" class="p" style="animation-delay:0.25s"/><text x="646" y="194" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#eaf6ff">URL encode / decode</text><circle cx="632" cy="234" r="4" fill="#b829ff" class="p" style="animation-delay:0.5s"/><text x="646" y="238" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#eaf6ff">Base64 encode / decode</text><circle cx="632" cy="278" r="4" fill="#b829ff" class="p" style="animation-delay:0.75s"/><text x="646" y="282" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#eaf6ff">Upper / lower</text><circle cx="632" cy="322" r="4" fill="#b829ff" class="p" style="animation-delay:1.0s"/><text x="646" y="326" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#eaf6ff">MD5 · SHA-1 · SHA-256</text><circle cx="632" cy="366" r="4" fill="#b829ff" class="p" style="animation-delay:1.25s"/><text x="646" y="370" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#eaf6ff">Find / replace</text><rect x="895" y="84" width="270" height="340" rx="14" fill="#0a121b" stroke="#00ff9d" stroke-width="1.5"/><text x="911" y="112" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="800" fill="#00ff9d">OPTIONS + RESULTS</text><circle cx="917" cy="146" r="4" fill="#00ff9d" class="p" style="animation-delay:0.0s"/><text x="931" y="150" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#eaf6ff">Threads · delay between requests</text><circle cx="917" cy="190" r="4" fill="#00ff9d" class="p" style="animation-delay:0.25s"/><text x="931" y="194" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#eaf6ff">Start · Pause · Stop</text><circle cx="917" cy="234" r="4" fill="#00ff9d" class="p" style="animation-delay:0.5s"/><text x="931" y="238" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#eaf6ff">Grep-match + grep-extract columns</text><circle cx="917" cy="278" r="4" fill="#00ff9d" class="p" style="animation-delay:0.75s"/><text x="931" y="282" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#eaf6ff">Filters: status/length/time/body</text><circle cx="917" cy="322" r="4" fill="#00ff9d" class="p" style="animation-delay:1.0s"/><text x="931" y="326" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#eaf6ff">Compare · CSV · JSON · HTML</text><line x1="310" y1="254" x2="327" y2="254" stroke="#8fa3b8" stroke-width="1.7" marker-end="url(#arr)"/><line x1="595" y1="254" x2="612" y2="254" stroke="#8fa3b8" stroke-width="1.7" marker-end="url(#arr)"/><line x1="880" y1="254" x2="897" y2="254" stroke="#8fa3b8" stroke-width="1.7" marker-end="url(#arr)"/><text x="40" y="454" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#8fa3b8">Save Config / Load Config keep an attack set-up. Attack types: Sniper · Battering Ram · Pitchfork · Cluster Bomb.</text>
</svg>
