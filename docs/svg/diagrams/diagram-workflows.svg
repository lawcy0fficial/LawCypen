<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Workflows">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00d9ff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3b8"/></marker>
    <style>
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes rot { to { transform: rotate(360deg) } }
      @keyframes fall { from { transform: translateY(-260px) } to { transform: translateY(420px) } }
      @keyframes dash { to { stroke-dashoffset: -40 } }
      @keyframes hl { 0%,100% { opacity:0 } 50% { opacity:.35 } }
      .p { animation: pulse 2.4s ease-in-out infinite }
      .d { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite }
      
    </style>
  </defs>
  <rect width="1200" height="300" rx="18" fill="#050810"/>
  <rect width="1200" height="300" rx="18" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="298" rx="18" fill="none" stroke="#00d9ff" stroke-opacity="0.28"/>
<text x="40" y="40" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="17" font-weight="800" letter-spacing="1.5" fill="#eaf6ff">WORKFLOWS — RECORD AND REPLAY</text><text x="40" y="62" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#8fa3b8">Replay resends each step's exact request, in order</text><rect x="40.0" y="100" width="156.66666666666666" height="70" rx="11" fill="#0a121b" stroke="#ff3860" stroke-width="1.6"/><rect x="40.0" y="100" width="156.66666666666666" height="70" rx="11" fill="#ff3860" opacity="0.06"/><text x="118.33333333333333" y="140.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">Record</text><line x1="196.66666666666666" y1="135" x2="226.66666666666666" y2="135" stroke="#ff3860" stroke-width="1.7" class="d" marker-end="url(#arr)"/><rect x="226.66666666666666" y="100" width="156.66666666666666" height="70" rx="11" fill="#0a121b" stroke="#00d9ff" stroke-width="1.6"/><rect x="226.66666666666666" y="100" width="156.66666666666666" height="70" rx="11" fill="#00d9ff" opacity="0.06"/><text x="305.0" y="140.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">Step 1</text><line x1="383.3333333333333" y1="135" x2="413.3333333333333" y2="135" stroke="#00d9ff" stroke-width="1.7" class="d" marker-end="url(#arr)"/><rect x="413.3333333333333" y="100" width="156.66666666666666" height="70" rx="11" fill="#0a121b" stroke="#00d9ff" stroke-width="1.6"/><rect x="413.3333333333333" y="100" width="156.66666666666666" height="70" rx="11" fill="#00d9ff" opacity="0.06"/><text x="491.66666666666663" y="140.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">Step 2</text><line x1="570.0" y1="135" x2="600.0" y2="135" stroke="#00d9ff" stroke-width="1.7" class="d" marker-end="url(#arr)"/><rect x="600.0" y="100" width="156.66666666666666" height="70" rx="11" fill="#0a121b" stroke="#00d9ff" stroke-width="1.6"/><rect x="600.0" y="100" width="156.66666666666666" height="70" rx="11" fill="#00d9ff" opacity="0.06"/><text x="678.3333333333334" y="140.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">Step 3</text><line x1="756.6666666666666" y1="135" x2="786.6666666666666" y2="135" stroke="#00d9ff" stroke-width="1.7" class="d" marker-end="url(#arr)"/><rect x="786.6666666666666" y="100" width="156.66666666666666" height="70" rx="11" fill="#0a121b" stroke="#00ff9d" stroke-width="1.6"/><rect x="786.6666666666666" y="100" width="156.66666666666666" height="70" rx="11" fill="#00ff9d" opacity="0.06"/><text x="865.0" y="140.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">Save</text><line x1="943.3333333333333" y1="135" x2="973.3333333333333" y2="135" stroke="#00ff9d" stroke-width="1.7" class="d" marker-end="url(#arr)"/><rect x="973.3333333333333" y="100" width="156.66666666666666" height="70" rx="11" fill="#0a121b" stroke="#ffb800" stroke-width="1.6"/><rect x="973.3333333333333" y="100" width="156.66666666666666" height="70" rx="11" fill="#ffb800" opacity="0.06"/><text x="1051.6666666666665" y="140.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">Replay</text><circle r="5" fill="#00ff9d" filter="url(#glow)"><animateMotion dur="5s" begin="0s" repeatCount="indefinite" path="M40 135 L1160 135"/></circle><rect x="600.0" y="196" width="343.3333333333333" height="46" rx="10" fill="#ff3860" opacity="0.12" stroke="#ff3860"/><text x="771.6666666666666" y="224" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#ff3860">stale token at step 3 = expected, not a bug</text><text x="40" y="284" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">No automatic token chaining between steps — guessing which field should chain would break more replays than it fixes.</text>
</svg>
