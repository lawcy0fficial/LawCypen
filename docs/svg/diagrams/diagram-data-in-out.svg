<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Data in and out">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00d9ff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3b8"/></marker>
    <style>
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes rot { to { transform: rotate(360deg) } }
      @keyframes fall { from { transform: translateY(-260px) } to { transform: translateY(420px) } }
      @keyframes dash { to { stroke-dashoffset: -40 } }
      @keyframes hl { 0%,100% { opacity:0 } 50% { opacity:.35 } }
      .p { animation: pulse 2.4s ease-in-out infinite }
      .d { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite }
      
    </style>
  </defs>
  <rect width="1200" height="420" rx="18" fill="#050810"/>
  <rect width="1200" height="420" rx="18" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="418" rx="18" fill="none" stroke="#00d9ff" stroke-opacity="0.28"/>
<text x="40" y="40" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="17" font-weight="800" letter-spacing="1.5" fill="#eaf6ff">GETTING DATA IN AND OUT</text><rect x="40" y="90" width="260" height="90" rx="11" fill="#0a121b" stroke="#00d9ff" stroke-width="1.6"/><rect x="40" y="90" width="260" height="90" rx="11" fill="#00d9ff" opacity="0.06"/><text x="170.0" y="129.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="15" font-weight="700" fill="#eaf6ff">HTTP History</text><text x="170.0" y="148.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#00d9ff">captured traffic</text><rect x="430" y="40" width="360" height="64" rx="11" fill="#0a121b" stroke="#00ff9d" stroke-width="1.6"/><rect x="430" y="40" width="360" height="64" rx="11" fill="#00ff9d" opacity="0.06"/><text x="610.0" y="66.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">HAR</text><text x="610.0" y="85.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#00ff9d">opens in Chrome DevTools, Burp, Postman</text><line x1="300" y1="135" x2="430" y2="72" stroke="#00ff9d" stroke-width="1.7" class="d" marker-end="url(#arr)"/><rect x="430" y="120" width="360" height="64" rx="11" fill="#0a121b" stroke="#ffb800" stroke-width="1.6"/><rect x="430" y="120" width="360" height="64" rx="11" fill="#ffb800" opacity="0.06"/><text x="610.0" y="146.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">Postman</text><text x="610.0" y="165.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#ffb800">Collection v2.1 — also importable into Insomnia</text><line x1="300" y1="135" x2="430" y2="152" stroke="#ffb800" stroke-width="1.7" class="d" marker-end="url(#arr)"/><rect x="430" y="200" width="360" height="64" rx="11" fill="#0a121b" stroke="#00d9ff" stroke-width="1.6"/><rect x="430" y="200" width="360" height="64" rx="11" fill="#00d9ff" opacity="0.06"/><text x="610.0" y="226.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">HAR (import)</text><text x="610.0" y="245.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#00d9ff">load a .har into History</text><line x1="300" y1="135" x2="430" y2="232" stroke="#00d9ff" stroke-width="1.7" class="d" marker-end="url(#arr)"/><rect x="860" y="70" width="300" height="70" rx="11" fill="#0a121b" stroke="#b829ff" stroke-width="1.6"/><rect x="860" y="70" width="300" height="70" rx="11" fill="#b829ff" opacity="0.06"/><text x="1010.0" y="110.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">Save Project</text><rect x="860" y="170" width="300" height="70" rx="11" fill="#0a121b" stroke="#ff3860" stroke-width="1.6"/><rect x="860" y="170" width="300" height="70" rx="11" fill="#ff3860" opacity="0.06"/><text x="1010.0" y="199.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="700" fill="#eaf6ff">Load Project</text><text x="1010.0" y="218.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#ff3860">overwrites current Scope / rules / History</text><text x="860" y="270" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#8fa3b8">A project file holds: Scope · saved requests · rules · macros ·</text><text x="860" y="290" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#8fa3b8">current findings and History.</text><text x="40" y="400" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#8fa3b8">Intruder results export separately as CSV, JSON, or HTML. The Report tab exports HTML, Markdown, GitHub Issues, Jira Issues, and SARIF.</text>
</svg>
