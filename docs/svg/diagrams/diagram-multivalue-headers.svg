<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Multi-value headers">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00d9ff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3b8"/></marker>
    <style>
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes rot { to { transform: rotate(360deg) } }
      @keyframes fall { from { transform: translateY(-260px) } to { transform: translateY(420px) } }
      @keyframes dash { to { stroke-dashoffset: -40 } }
      @keyframes hl { 0%,100% { opacity:0 } 50% { opacity:.35 } }
      .p { animation: pulse 2.4s ease-in-out infinite }
      .d { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite }
      
    </style>
  </defs>
  <rect width="1200" height="260" rx="18" fill="#050810"/>
  <rect width="1200" height="260" rx="18" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="258" rx="18" fill="none" stroke="#00d9ff" stroke-opacity="0.28"/>
<text x="40" y="40" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="17" font-weight="800" letter-spacing="1.5" fill="#eaf6ff">REPEATED HEADERS NOW SURVIVE</text><text x="40" y="62" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#8fa3b8">Set-Cookie, Vary, Link… previously collapsed to their last value</text><rect x="40" y="110" width="260" height="90" rx="11" fill="#0a121b" stroke="#ff3860" stroke-width="1.6"/><rect x="40" y="110" width="260" height="90" rx="11" fill="#ff3860" opacity="0.06"/><text x="170.0" y="149.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">Set-Cookie: a=1</text><text x="170.0" y="168.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#ff3860">Set-Cookie: b=2</text><line x1="300" y1="155" x2="470" y2="155" stroke="#ffb800" stroke-width="1.7" class="d" marker-end="url(#arr)"/><rect x="470" y="110" width="300" height="90" rx="11" fill="#0a121b" stroke="#00ff9d" stroke-width="1.6"/><rect x="470" y="110" width="300" height="90" rx="11" fill="#00ff9d" opacity="0.06"/><text x="620.0" y="149.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="15" font-weight="700" fill="#eaf6ff">a=1 ⏎ b=2</text><text x="620.0" y="168.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#00ff9d">internal \n multi-value marker</text><line x1="770" y1="155" x2="920" y2="155" stroke="#00ff9d" stroke-width="1.7" class="d" marker-end="url(#arr)"/><rect x="920" y="110" width="240" height="90" rx="11" fill="#0a121b" stroke="#00d9ff" stroke-width="1.6"/><rect x="920" y="110" width="240" height="90" rx="11" fill="#00d9ff" opacity="0.06"/><text x="1040.0" y="149.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">lossless round-trip</text><text x="1040.0" y="168.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#00d9ff">capture · parse · serialize</text><text x="40" y="236" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#8fa3b8">A header value can never legally contain a raw newline, so the marker is unambiguous.</text>
</svg>
