<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="History actions">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00d9ff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3b8"/></marker>
    <style>
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes rot { to { transform: rotate(360deg) } }
      @keyframes fall { from { transform: translateY(-260px) } to { transform: translateY(420px) } }
      @keyframes dash { to { stroke-dashoffset: -40 } }
      @keyframes hl { 0%,100% { opacity:0 } 50% { opacity:.35 } }
      .p { animation: pulse 2.4s ease-in-out infinite }
      .d { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite }
      
    </style>
  </defs>
  <rect width="1200" height="360" rx="18" fill="#050810"/>
  <rect width="1200" height="360" rx="18" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="358" rx="18" fill="none" stroke="#00d9ff" stroke-opacity="0.28"/>
<text x="40" y="40" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="17" font-weight="800" letter-spacing="1.5" fill="#eaf6ff">WHAT YOU CAN DO WITH A HISTORY ENTRY</text><rect x="40" y="140" width="250" height="90" rx="11" fill="#0a121b" stroke="#00d9ff" stroke-width="1.6"/><rect x="40" y="140" width="250" height="90" rx="11" fill="#00d9ff" opacity="0.06"/><text x="165.0" y="179.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="16" font-weight="700" fill="#eaf6ff">History entry</text><text x="165.0" y="198.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#00d9ff">click a row</text><rect x="430" y="70" width="340" height="60" rx="11" fill="#0a121b" stroke="#00ff9d" stroke-width="1.6"/><rect x="430" y="70" width="340" height="60" rx="11" fill="#00ff9d" opacity="0.06"/><text x="600.0" y="105.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">Send to Repeater</text><line x1="290" y1="185" x2="430" y2="100" stroke="#00ff9d" stroke-width="1.7" class="d" marker-end="url(#arr)"/><rect x="800" y="70" width="340" height="60" rx="11" fill="#0a121b" stroke="#ff3860" stroke-width="1.6"/><rect x="800" y="70" width="340" height="60" rx="11" fill="#ff3860" opacity="0.06"/><text x="970.0" y="105.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">Send to Intruder</text><line x1="290" y1="185" x2="800" y2="100" stroke="#ff3860" stroke-width="1.7" class="d" marker-end="url(#arr)"/><rect x="430" y="154" width="340" height="60" rx="11" fill="#0a121b" stroke="#ffb800" stroke-width="1.6"/><rect x="430" y="154" width="340" height="60" rx="11" fill="#ffb800" opacity="0.06"/><text x="600.0" y="189.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">Replay as role / vs all roles</text><line x1="290" y1="185" x2="430" y2="184" stroke="#ffb800" stroke-width="1.7" class="d" marker-end="url(#arr)"/><rect x="800" y="154" width="340" height="60" rx="11" fill="#0a121b" stroke="#b829ff" stroke-width="1.6"/><rect x="800" y="154" width="340" height="60" rx="11" fill="#b829ff" opacity="0.06"/><text x="970.0" y="189.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">Export as cURL</text><line x1="290" y1="185" x2="800" y2="184" stroke="#b829ff" stroke-width="1.7" class="d" marker-end="url(#arr)"/><rect x="430" y="238" width="340" height="60" rx="11" fill="#0a121b" stroke="#00d9ff" stroke-width="1.6"/><rect x="430" y="238" width="340" height="60" rx="11" fill="#00d9ff" opacity="0.06"/><text x="600.0" y="273.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">Copy response</text><line x1="290" y1="185" x2="430" y2="268" stroke="#00d9ff" stroke-width="1.7" class="d" marker-end="url(#arr)"/><rect x="800" y="238" width="340" height="60" rx="11" fill="#0a121b" stroke="#ff3ec9" stroke-width="1.6"/><rect x="800" y="238" width="340" height="60" rx="11" fill="#ff3ec9" opacity="0.06"/><text x="970.0" y="273.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">Add note + colour highlight</text><line x1="290" y1="185" x2="800" y2="268" stroke="#ff3ec9" stroke-width="1.7" class="d" marker-end="url(#arr)"/><circle r="5" fill="#00ff9d" filter="url(#glow)"><animateMotion dur="3s" begin="0s" repeatCount="indefinite" path="M290 185 L430 100"/></circle><circle r="5" fill="#ff3ec9" filter="url(#glow)"><animateMotion dur="3.6s" begin="1s" repeatCount="indefinite" path="M290 185 L800 184"/></circle><text x="40" y="344" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#8fa3b8">Also: load any entry into Comparer from its Side 1 / Side 2 pickers, or Record a Workflow while you browse.</text>
</svg>
