<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Race and rate limit">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00d9ff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3b8"/></marker>
    <style>
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes rot { to { transform: rotate(360deg) } }
      @keyframes fall { from { transform: translateY(-260px) } to { transform: translateY(420px) } }
      @keyframes dash { to { stroke-dashoffset: -40 } }
      @keyframes hl { 0%,100% { opacity:0 } 50% { opacity:.35 } }
      .p { animation: pulse 2.4s ease-in-out infinite }
      .d { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite }
      
    </style>
  </defs>
  <rect width="1200" height="320" rx="18" fill="#050810"/>
  <rect width="1200" height="320" rx="18" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="none" stroke="#00d9ff" stroke-opacity="0.28"/>
<text x="40" y="40" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="17" font-weight="800" letter-spacing="1.5" fill="#eaf6ff">RACE CONDITION TESTER  ·  RATE-LIMIT AUDITOR</text><text x="40" y="62" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#8fa3b8">Both live inside Repeater (Ctrl+Shift+E / Ctrl+Shift+L)</text><text x="300" y="100" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="800" fill="#ff3860">RACE — parallel burst</text><text x="900" y="100" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="800" fill="#ffb800">RATE LIMIT — sequential</text><line x1="60" y1="120" x2="540" y2="120" stroke="#ff3860" stroke-opacity="0.35" class="d"/><circle r="5" fill="#ff3860" filter="url(#glow)"><animateMotion dur="2.2s" begin="0s" repeatCount="indefinite" path="M60 120 L540 120"/></circle><line x1="60" y1="150" x2="540" y2="150" stroke="#ff3860" stroke-opacity="0.35" class="d"/><circle r="5" fill="#ff3860" filter="url(#glow)"><animateMotion dur="2.2s" begin="0s" repeatCount="indefinite" path="M60 150 L540 150"/></circle><line x1="60" y1="180" x2="540" y2="180" stroke="#ff3860" stroke-opacity="0.35" class="d"/><circle r="5" fill="#ff3860" filter="url(#glow)"><animateMotion dur="2.2s" begin="0s" repeatCount="indefinite" path="M60 180 L540 180"/></circle><line x1="60" y1="210" x2="540" y2="210" stroke="#ff3860" stroke-opacity="0.35" class="d"/><circle r="5" fill="#ff3860" filter="url(#glow)"><animateMotion dur="2.2s" begin="0s" repeatCount="indefinite" path="M60 210 L540 210"/></circle><line x1="60" y1="240" x2="540" y2="240" stroke="#ff3860" stroke-opacity="0.35" class="d"/><circle r="5" fill="#ff3860" filter="url(#glow)"><animateMotion dur="2.2s" begin="0s" repeatCount="indefinite" path="M60 240 L540 240"/></circle><line x1="60" y1="270" x2="540" y2="270" stroke="#ff3860" stroke-opacity="0.35" class="d"/><circle r="5" fill="#ff3860" filter="url(#glow)"><animateMotion dur="2.2s" begin="0s" repeatCount="indefinite" path="M60 270 L540 270"/></circle><line x1="540" y1="115" x2="540" y2="285" stroke="#ff3860" stroke-width="2"/><text x="300" y="305" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">several 2xx on a use-once endpoint = a lead</text><rect x="660" y="200" width="40" height="40" rx="5" fill="#ffb800" opacity="0.8" class="p" style="animation-delay:0.0s"/><rect x="716" y="188" width="40" height="52" rx="5" fill="#ffb800" opacity="0.8" class="p" style="animation-delay:0.2s"/><rect x="772" y="176" width="40" height="64" rx="5" fill="#ffb800" opacity="0.8" class="p" style="animation-delay:0.4s"/><rect x="828" y="164" width="40" height="76" rx="5" fill="#ffb800" opacity="0.8" class="p" style="animation-delay:0.6000000000000001s"/><rect x="884" y="152" width="40" height="88" rx="5" fill="#ffb800" opacity="0.8" class="p" style="animation-delay:0.8s"/><rect x="940" y="140" width="40" height="100" rx="5" fill="#ff3860" opacity="0.9" class="p" style="animation-delay:1.0s"/><rect x="996" y="128" width="40" height="112" rx="5" fill="#ff3860" opacity="0.9" class="p" style="animation-delay:1.2000000000000002s"/><rect x="1052" y="116" width="40" height="124" rx="5" fill="#ff3860" opacity="0.9" class="p" style="animation-delay:1.4000000000000001s"/><text x="900" y="305" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">finds the first 429 / 503 / Retry-After / zero-remaining</text>
</svg>
