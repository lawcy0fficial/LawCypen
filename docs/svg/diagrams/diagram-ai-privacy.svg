<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="AI privacy">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00d9ff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3b8"/></marker>
    <style>
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes rot { to { transform: rotate(360deg) } }
      @keyframes fall { from { transform: translateY(-260px) } to { transform: translateY(420px) } }
      @keyframes dash { to { stroke-dashoffset: -40 } }
      @keyframes hl { 0%,100% { opacity:0 } 50% { opacity:.35 } }
      .p { animation: pulse 2.4s ease-in-out infinite }
      .d { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite }
      
    </style>
  </defs>
  <rect width="1200" height="360" rx="18" fill="#050810"/>
  <rect width="1200" height="360" rx="18" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="358" rx="18" fill="none" stroke="#00d9ff" stroke-opacity="0.28"/>
<text x="40" y="40" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="17" font-weight="800" letter-spacing="1.5" fill="#eaf6ff">AI ANALYSIS — WHAT LEAVES YOUR MACHINE</text><text x="40" y="62" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#8fa3b8">Direct browser → OpenRouter, using your own key</text><text x="300" y="100" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#00ff9d">SENT (summaries only)</text><text x="900" y="100" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#ff3860">NEVER SENT</text><rect x="60" y="116" width="480" height="30" rx="8" fill="#00ff9d" opacity="0.08"/><text x="76" y="136" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12.5" font-weight="400" fill="#00ff9d">→ Endpoint templates</text><rect x="60" y="154" width="480" height="30" rx="8" fill="#00ff9d" opacity="0.08"/><text x="76" y="174" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12.5" font-weight="400" fill="#00ff9d">→ Secrets — already masked</text><rect x="60" y="192" width="480" height="30" rx="8" fill="#00ff9d" opacity="0.08"/><text x="76" y="212" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12.5" font-weight="400" fill="#00ff9d">→ JWT claims — already redacted</text><rect x="60" y="230" width="480" height="30" rx="8" fill="#00ff9d" opacity="0.08"/><text x="76" y="250" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12.5" font-weight="400" fill="#00ff9d">→ IDOR candidate metadata</text><rect x="60" y="268" width="480" height="30" rx="8" fill="#00ff9d" opacity="0.08"/><text x="76" y="288" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12.5" font-weight="400" fill="#00ff9d">→ S3 / takeover verdicts</text><rect x="660" y="116" width="480" height="30" rx="8" fill="#ff3860" opacity="0.08"/><text x="676" y="136" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12.5" font-weight="400" fill="#ff3860">✕ Raw History request bodies</text><rect x="660" y="154" width="480" height="30" rx="8" fill="#ff3860" opacity="0.08"/><text x="676" y="174" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12.5" font-weight="400" fill="#ff3860">✕ Raw History response bodies</text><rect x="660" y="192" width="480" height="30" rx="8" fill="#ff3860" opacity="0.08"/><text x="676" y="212" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12.5" font-weight="400" fill="#ff3860">✕ Your API key (stored locally only)</text><rect x="660" y="230" width="480" height="30" rx="8" fill="#ff3860" opacity="0.08"/><text x="676" y="250" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12.5" font-weight="400" fill="#ff3860">✕ Anything that could act on the target</text><text x="600" y="338" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#8fa3b8">The model returns text only. It cannot fire requests or touch Repeater.</text>
</svg>
