<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 356" width="1200" height="356" role="img" aria-label="CSRF logic">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00d9ff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3b8"/></marker>
    <style>
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes rot { to { transform: rotate(360deg) } }
      @keyframes fall { from { transform: translateY(-260px) } to { transform: translateY(420px) } }
      @keyframes dash { to { stroke-dashoffset: -40 } }
      @keyframes hl { 0%,100% { opacity:0 } 50% { opacity:.35 } }
      .p { animation: pulse 2.4s ease-in-out infinite }
      .d { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite }
      
    </style>
  </defs>
  <rect width="1200" height="356" rx="18" fill="#050810"/>
  <rect width="1200" height="356" rx="18" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="354" rx="18" fill="none" stroke="#00d9ff" stroke-opacity="0.28"/>
<text x="40" y="40" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="17" font-weight="800" letter-spacing="1.5" fill="#eaf6ff">CSRF HEURISTIC — DECISION PATH</text><text x="40" y="62" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#8fa3b8">A lead worth checking, not a verdict</text><rect x="40" y="130" width="200" height="80" rx="11" fill="#0a121b" stroke="#00d9ff" stroke-width="1.6"/><rect x="40" y="130" width="200" height="80" rx="11" fill="#00d9ff" opacity="0.06"/><text x="140.0" y="175.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">Request captured</text><rect x="300" y="130" width="220" height="80" rx="11" fill="#0a121b" stroke="#ffb800" stroke-width="1.6"/><rect x="300" y="130" width="220" height="80" rx="11" fill="#ffb800" opacity="0.06"/><text x="410.0" y="164.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="700" fill="#eaf6ff">POST/PUT/PATCH/DELETE?</text><text x="410.0" y="183.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#ffb800">state-changing method</text><rect x="590" y="130" width="200" height="80" rx="11" fill="#0a121b" stroke="#ffb800" stroke-width="1.6"/><rect x="590" y="130" width="200" height="80" rx="11" fill="#ffb800" opacity="0.06"/><text x="690.0" y="164.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">Cookie present?</text><text x="690.0" y="183.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#ffb800">browser-CSRF scenario</text><rect x="860" y="130" width="190" height="80" rx="11" fill="#0a121b" stroke="#ffb800" stroke-width="1.6"/><rect x="860" y="130" width="190" height="80" rx="11" fill="#ffb800" opacity="0.06"/><text x="955.0" y="164.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="700" fill="#eaf6ff">Token in body/header?</text><text x="955.0" y="183.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#ffb800">csrf · xsrf · X-CSRF-Token…</text><rect x="860" y="250" width="190" height="56" rx="11" fill="#0a121b" stroke="#ff3860" stroke-width="1.6"/><rect x="860" y="250" width="190" height="56" rx="11" fill="#ff3860" opacity="0.06"/><text x="955.0" y="283.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="700" fill="#eaf6ff">No token → candidate</text><rect x="590" y="250" width="200" height="56" rx="11" fill="#0a121b" stroke="#8fa3b8" stroke-width="1.6"/><rect x="590" y="250" width="200" height="56" rx="11" fill="#8fa3b8" opacity="0.06"/><text x="690.0" y="283.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="700" fill="#eaf6ff">Skip (bearer / S2S)</text><rect x="300" y="250" width="220" height="56" rx="11" fill="#0a121b" stroke="#8fa3b8" stroke-width="1.6"/><rect x="300" y="250" width="220" height="56" rx="11" fill="#8fa3b8" opacity="0.06"/><text x="410.0" y="283.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="700" fill="#eaf6ff">Skip (safe method)</text><line x1="240" y1="170" x2="300" y2="170" stroke="#00d9ff" stroke-width="1.7" class="d" marker-end="url(#arr)"/><line x1="520" y1="170" x2="590" y2="170" stroke="#ffb800" stroke-width="1.7" class="d" marker-end="url(#arr)"/><line x1="790" y1="170" x2="860" y2="170" stroke="#ffb800" stroke-width="1.7" class="d" marker-end="url(#arr)"/><line x1="410" y1="210" x2="410" y2="250" stroke="#8fa3b8" stroke-width="1.7" class="d" marker-end="url(#arr)"/><line x1="690" y1="210" x2="690" y2="250" stroke="#8fa3b8" stroke-width="1.7" class="d" marker-end="url(#arr)"/><line x1="955" y1="210" x2="955" y2="250" stroke="#ff3860" stroke-width="1.7" class="d" marker-end="url(#arr)"/><text x="40" y="342" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">SameSite cookies or custom-header conventions can legitimately protect an endpoint — try dropping the token and see.</text>
</svg>
