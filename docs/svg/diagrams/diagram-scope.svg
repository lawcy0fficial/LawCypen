<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Scope enforcement">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00d9ff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3b8"/></marker>
    <style>
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes rot { to { transform: rotate(360deg) } }
      @keyframes fall { from { transform: translateY(-260px) } to { transform: translateY(420px) } }
      @keyframes dash { to { stroke-dashoffset: -40 } }
      @keyframes hl { 0%,100% { opacity:0 } 50% { opacity:.35 } }
      .p { animation: pulse 2.4s ease-in-out infinite }
      .d { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite }
      
    </style>
  </defs>
  <rect width="1200" height="340" rx="18" fill="#050810"/>
  <rect width="1200" height="340" rx="18" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="338" rx="18" fill="none" stroke="#00d9ff" stroke-opacity="0.28"/>
<text x="40" y="40" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="17" font-weight="800" letter-spacing="1.5" fill="#eaf6ff">SCOPE ENFORCEMENT — BEFORE STORAGE</text><text x="40" y="62" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#8fa3b8">DevTools can observe any tab, so background.js filters in software</text><rect x="40" y="140" width="200" height="80" rx="11" fill="#0a121b" stroke="#00d9ff" stroke-width="1.6"/><rect x="40" y="140" width="200" height="80" rx="11" fill="#00d9ff" opacity="0.06"/><text x="140.0" y="174.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">Captured request</text><text x="140.0" y="193.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#00d9ff">onRequestFinished</text><rect x="340" y="130" width="260" height="100" rx="11" fill="#0a121b" stroke="#ffb800" stroke-width="1.6"/><rect x="340" y="130" width="260" height="100" rx="11" fill="#ffb800" opacity="0.06"/><text x="470.0" y="174.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="16" font-weight="700" fill="#eaf6ff">Scope check</text><text x="470.0" y="193.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#ffb800">targets + include − exclude</text><rect x="760" y="80" width="220" height="70" rx="11" fill="#0a121b" stroke="#00ff9d" stroke-width="1.6"/><rect x="760" y="80" width="220" height="70" rx="11" fill="#00ff9d" opacity="0.06"/><text x="870.0" y="109.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">Stored</text><text x="870.0" y="128.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#00ff9d">History + analyzers</text><rect x="760" y="210" width="220" height="70" rx="11" fill="#0a121b" stroke="#ff3860" stroke-width="1.6"/><rect x="760" y="210" width="220" height="70" rx="11" fill="#ff3860" opacity="0.06"/><text x="870.0" y="239.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">Dropped</text><text x="870.0" y="258.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#ff3860">never written anywhere</text><line x1="240" y1="180" x2="340" y2="180" stroke="#00d9ff" stroke-width="1.7" class="d" marker-end="url(#arr)"/><line x1="600" y1="165" x2="760" y2="115" stroke="#00ff9d" stroke-width="1.7" class="d" marker-end="url(#arr)"/><line x1="600" y1="195" x2="760" y2="245" stroke="#ff3860" stroke-width="1.7" class="d" marker-end="url(#arr)"/><circle r="5" fill="#00ff9d" filter="url(#glow)"><animateMotion dur="3.4s" begin="0s" repeatCount="indefinite" path="M240 180 L340 180 L600 165 L760 115"/></circle><circle r="5" fill="#ff3860" filter="url(#glow)"><animateMotion dur="3.4s" begin="1.7s" repeatCount="indefinite" path="M240 180 L340 180 L600 195 L760 245"/></circle><text x="990" y="120" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#00ff9d">authorized origin</text><text x="990" y="250" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#ff3860">unauthorized origin</text><text x="40" y="316" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#8fa3b8">Repeater sends additionally require the per-origin host-permission grant from Authorize.</text>
</svg>
