<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="OAuth checks">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00d9ff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3b8"/></marker>
    <style>
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes rot { to { transform: rotate(360deg) } }
      @keyframes fall { from { transform: translateY(-260px) } to { transform: translateY(420px) } }
      @keyframes dash { to { stroke-dashoffset: -40 } }
      @keyframes hl { 0%,100% { opacity:0 } 50% { opacity:.35 } }
      .p { animation: pulse 2.4s ease-in-out infinite }
      .d { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite }
      
    </style>
  </defs>
  <rect width="1200" height="330" rx="18" fill="#050810"/>
  <rect width="1200" height="330" rx="18" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="328" rx="18" fill="none" stroke="#00d9ff" stroke-opacity="0.28"/>
<text x="40" y="40" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="17" font-weight="800" letter-spacing="1.5" fill="#eaf6ff">OAUTH / OIDC FLOW CHECKS</text><text x="40" y="62" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#8fa3b8">Inspection of captured authorize + token requests. Never starts or modifies a flow.</text><rect x="40" y="90" width="360" height="92" rx="12" fill="#0a121b" stroke="#ff3860" stroke-width="1.3"/><text x="54" y="114" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">Missing state parameter</text><rect x="326" y="99" width="60" height="20" rx="10" fill="#ff3860" opacity="0.18" stroke="#ff3860"/><text x="356" y="113" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10" font-weight="800" fill="#ff3860">HIGH</text><text x="54" y="136" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">Login-CSRF / account-linking risk</text><text x="54" y="153" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">request kind: authorize</text><rect x="420" y="90" width="360" height="92" rx="12" fill="#0a121b" stroke="#ffb800" stroke-width="1.3"/><text x="434" y="114" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">Implicit flow in use</text><rect x="706" y="99" width="60" height="20" rx="10" fill="#ffb800" opacity="0.18" stroke="#ffb800"/><text x="736" y="113" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10" font-weight="800" fill="#ffb800">MEDIUM</text><text x="434" y="136" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">Token in URL fragment: history, referrer, logs</text><text x="434" y="153" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">request kind: authorize</text><rect x="800" y="90" width="360" height="92" rx="12" fill="#0a121b" stroke="#ffb800" stroke-width="1.3"/><text x="814" y="114" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">Auth code without PKCE</text><rect x="1086" y="99" width="60" height="20" rx="10" fill="#ffb800" opacity="0.18" stroke="#ffb800"/><text x="1116" y="113" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10" font-weight="800" fill="#ffb800">MEDIUM</text><text x="814" y="136" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">No code_challenge on a public client</text><text x="814" y="153" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">request kind: authorize</text><rect x="40" y="200" width="360" height="92" rx="12" fill="#0a121b" stroke="#ffb800" stroke-width="1.3"/><text x="54" y="224" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">redirect_uri uses plain HTTP</text><rect x="326" y="209" width="60" height="20" rx="10" fill="#ffb800" opacity="0.18" stroke="#ffb800"/><text x="356" y="223" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10" font-weight="800" fill="#ffb800">MEDIUM</text><text x="54" y="246" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">Code / token sent unencrypted</text><text x="54" y="263" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">request kind: authorize</text><rect x="420" y="200" width="360" height="92" rx="12" fill="#0a121b" stroke="#ff3860" stroke-width="1.3"/><text x="434" y="224" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">Secret/code in token-request URL</text><rect x="706" y="209" width="60" height="20" rx="10" fill="#ff3860" opacity="0.18" stroke="#ff3860"/><text x="736" y="223" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10" font-weight="800" fill="#ff3860">HIGH</text><text x="434" y="246" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">Ends up in access logs, history, Referer</text><text x="434" y="263" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">request kind: token</text>
</svg>
