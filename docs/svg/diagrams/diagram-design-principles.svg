<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Design principles">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00d9ff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3b8"/></marker>
    <style>
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes rot { to { transform: rotate(360deg) } }
      @keyframes fall { from { transform: translateY(-260px) } to { transform: translateY(420px) } }
      @keyframes dash { to { stroke-dashoffset: -40 } }
      @keyframes hl { 0%,100% { opacity:0 } 50% { opacity:.35 } }
      .p { animation: pulse 2.4s ease-in-out infinite }
      .d { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite }
      
    </style>
  </defs>
  <rect width="1200" height="400" rx="18" fill="#050810"/>
  <rect width="1200" height="400" rx="18" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="398" rx="18" fill="none" stroke="#00d9ff" stroke-opacity="0.28"/>
<text x="40" y="40" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="17" font-weight="800" letter-spacing="1.5" fill="#eaf6ff">DESIGN PRINCIPLES</text><rect x="40" y="76" width="360" height="136" rx="14" fill="#0a121b" stroke="#00ff9d" stroke-width="1.5"/><circle cx="70" cy="108" r="10" fill="#00ff9d" class="p" style="animation-delay:0.0s"/><text x="92" y="113" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="800" fill="#eaf6ff">Flag, don't auto-exploit</text><text x="60" y="152" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#8fa3b8">Findings are evidence plus a jump-off. You decide th</text><text x="60" y="172" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#8fa3b8">e next move.</text><rect x="420" y="76" width="360" height="136" rx="14" fill="#0a121b" stroke="#00d9ff" stroke-width="1.5"/><circle cx="450" cy="108" r="10" fill="#00d9ff" class="p" style="animation-delay:0.3s"/><text x="472" y="113" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="800" fill="#eaf6ff">Passive by default</text><text x="440" y="152" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#8fa3b8">Only labelled tabs send traffic, and only when you p</text><text x="440" y="172" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#8fa3b8">ress a button.</text><rect x="800" y="76" width="360" height="136" rx="14" fill="#0a121b" stroke="#ffb800" stroke-width="1.5"/><circle cx="830" cy="108" r="10" fill="#ffb800" class="p" style="animation-delay:0.6s"/><text x="852" y="113" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="800" fill="#eaf6ff">Scope before storage</text><text x="820" y="152" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#8fa3b8">Unauthorized origins are filtered out before anythin</text><text x="820" y="172" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#8fa3b8">g is written.</text><rect x="40" y="228" width="360" height="136" rx="14" fill="#0a121b" stroke="#ff3860" stroke-width="1.5"/><circle cx="70" cy="260" r="10" fill="#ff3860" class="p" style="animation-delay:0.8999999999999999s"/><text x="92" y="265" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="800" fill="#eaf6ff">Mask before storing</text><text x="60" y="304" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#8fa3b8">Secrets keep a prefix, suffix and length — never the</text><text x="60" y="324" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#8fa3b8"> raw value.</text><rect x="420" y="228" width="360" height="136" rx="14" fill="#0a121b" stroke="#ff3ec9" stroke-width="1.5"/><circle cx="450" cy="260" r="10" fill="#ff3ec9" class="p" style="animation-delay:1.2s"/><text x="472" y="265" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="800" fill="#eaf6ff">Heuristics say so</text><text x="440" y="304" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#8fa3b8">Every heuristic is explicit about what it is not: le</text><text x="440" y="324" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#8fa3b8">ads, not verdicts.</text><rect x="800" y="228" width="360" height="136" rx="14" fill="#0a121b" stroke="#b829ff" stroke-width="1.5"/><circle cx="830" cy="260" r="10" fill="#b829ff" class="p" style="animation-delay:1.5s"/><text x="852" y="265" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="800" fill="#eaf6ff">Declarative extensibility</text><text x="820" y="304" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#8fa3b8">Custom Rules match text; they never run pasted code.</text><text x="820" y="324" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#8fa3b8"></text>
</svg>
