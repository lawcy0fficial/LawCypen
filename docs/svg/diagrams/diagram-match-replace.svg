<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Match and replace">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00d9ff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3b8"/></marker>
    <style>
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes rot { to { transform: rotate(360deg) } }
      @keyframes fall { from { transform: translateY(-260px) } to { transform: translateY(420px) } }
      @keyframes dash { to { stroke-dashoffset: -40 } }
      @keyframes hl { 0%,100% { opacity:0 } 50% { opacity:.35 } }
      .p { animation: pulse 2.4s ease-in-out infinite }
      .d { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite }
      
    </style>
  </defs>
  <rect width="1200" height="330" rx="18" fill="#050810"/>
  <rect width="1200" height="330" rx="18" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="328" rx="18" fill="none" stroke="#00d9ff" stroke-opacity="0.28"/>
<text x="40" y="40" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="17" font-weight="800" letter-spacing="1.5" fill="#eaf6ff">MATCH &amp; REPLACE — RULES RUN TOP TO BOTTOM</text><text x="40" y="62" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#8fa3b8">Order matters once two rules can match the same text</text><rect x="40" y="84" width="106" height="28" rx="14.0" fill="#00d9ff" opacity="0.12" stroke="#00d9ff" stroke-opacity="0.7"/><text x="92.92" y="102.2" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="600" fill="#eaf6ff">request URL</text><rect x="230" y="84" width="128" height="28" rx="14.0" fill="#00d9ff" opacity="0.12" stroke="#00d9ff" stroke-opacity="0.7"/><text x="294.08" y="102.2" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="600" fill="#eaf6ff">request method</text><rect x="420" y="84" width="128" height="28" rx="14.0" fill="#00d9ff" opacity="0.12" stroke="#00d9ff" stroke-opacity="0.7"/><text x="484.08" y="102.2" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="600" fill="#eaf6ff">request header</text><rect x="610" y="84" width="113" height="28" rx="14.0" fill="#00d9ff" opacity="0.12" stroke="#00d9ff" stroke-opacity="0.7"/><text x="666.64" y="102.2" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="600" fill="#eaf6ff">request body</text><rect x="40" y="124" width="143" height="28" rx="14.0" fill="#8fa3b8" opacity="0.12" stroke="#8fa3b8" stroke-opacity="0.7"/><text x="111.52" y="142.2" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="600" fill="#eaf6ff">response status*</text><rect x="260" y="124" width="143" height="28" rx="14.0" fill="#8fa3b8" opacity="0.12" stroke="#8fa3b8" stroke-opacity="0.7"/><text x="331.52" y="142.2" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="600" fill="#eaf6ff">response header*</text><rect x="480" y="124" width="128" height="28" rx="14.0" fill="#8fa3b8" opacity="0.12" stroke="#8fa3b8" stroke-opacity="0.7"/><text x="544.08" y="142.2" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="600" fill="#eaf6ff">response body*</text><rect x="40" y="190" width="270" height="56" rx="11" fill="#0a121b" stroke="#00ff9d" stroke-width="1.6"/><rect x="40" y="190" width="270" height="56" rx="11" fill="#00ff9d" opacity="0.06"/><text x="175.0" y="223.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">1  Rule A</text><line x1="310" y1="218" x2="340" y2="218" stroke="#00ff9d" stroke-width="1.7" class="d" marker-end="url(#arr)"/><rect x="340" y="190" width="270" height="56" rx="11" fill="#0a121b" stroke="#ffb800" stroke-width="1.6"/><rect x="340" y="190" width="270" height="56" rx="11" fill="#ffb800" opacity="0.06"/><text x="475.0" y="223.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">2  Rule B</text><line x1="610" y1="218" x2="640" y2="218" stroke="#ffb800" stroke-width="1.7" class="d" marker-end="url(#arr)"/><rect x="640" y="190" width="270" height="56" rx="11" fill="#0a121b" stroke="#ff3ec9" stroke-width="1.6"/><rect x="640" y="190" width="270" height="56" rx="11" fill="#ff3ec9" opacity="0.06"/><text x="775.0" y="223.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">3  Rule C</text><rect x="940" y="170" width="220" height="96" rx="11" fill="#0a121b" stroke="#00ff9d" stroke-width="1.6"/><rect x="940" y="170" width="220" height="96" rx="11" fill="#00ff9d" opacity="0.06"/><text x="1050.0" y="212.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">Applied to</text><text x="1050.0" y="231.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#00ff9d">Repeater · Intruder sends</text><text x="40" y="310" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">* response rewrites are display-only. Literal or regex matching. Live Rewrite (headers / block / redirect / HTTPS) is separate.</text>
</svg>
