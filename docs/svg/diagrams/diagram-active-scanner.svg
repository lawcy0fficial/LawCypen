<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Active scanner guardrails">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00d9ff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3b8"/></marker>
    <style>
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes rot { to { transform: rotate(360deg) } }
      @keyframes fall { from { transform: translateY(-260px) } to { transform: translateY(420px) } }
      @keyframes dash { to { stroke-dashoffset: -40 } }
      @keyframes hl { 0%,100% { opacity:0 } 50% { opacity:.35 } }
      .p { animation: pulse 2.4s ease-in-out infinite }
      .d { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite }
      
    </style>
  </defs>
  <rect width="1200" height="340" rx="18" fill="#050810"/>
  <rect width="1200" height="340" rx="18" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="338" rx="18" fill="none" stroke="#00d9ff" stroke-opacity="0.28"/>
<text x="40" y="40" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="17" font-weight="800" letter-spacing="1.5" fill="#eaf6ff">ACTIVE SCANNER — GUARDRAILS</text><text x="40" y="62" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#8fa3b8">The one tab that sends real modified requests. Everything else is passive.</text><rect x="40" y="100" width="146" height="40" rx="20" fill="#ffb800" opacity="0.12" stroke="#ffb800"/><text x="113" y="126" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="700" fill="#ffb800">SQLi</text><rect x="198" y="100" width="146" height="40" rx="20" fill="#ffb800" opacity="0.12" stroke="#ffb800"/><text x="271" y="126" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="700" fill="#ffb800">Reflected XSS</text><rect x="356" y="100" width="146" height="40" rx="20" fill="#ffb800" opacity="0.12" stroke="#ffb800"/><text x="429" y="126" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="700" fill="#ffb800">Path traversal</text><rect x="514" y="100" width="146" height="40" rx="20" fill="#ffb800" opacity="0.12" stroke="#ffb800"/><text x="587" y="126" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="700" fill="#ffb800">Open redirect</text><rect x="672" y="100" width="146" height="40" rx="20" fill="#ffb800" opacity="0.12" stroke="#ffb800"/><text x="745" y="126" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="700" fill="#ffb800">SSRF</text><rect x="830" y="100" width="146" height="40" rx="20" fill="#ffb800" opacity="0.12" stroke="#ffb800"/><text x="903" y="126" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="700" fill="#ffb800">SSTI</text><rect x="988" y="100" width="146" height="40" rx="20" fill="#ffb800" opacity="0.12" stroke="#ffb800"/><text x="1061" y="126" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="700" fill="#ffb800">XXE</text><rect x="40" y="190" width="210" height="80" rx="11" fill="#0a121b" stroke="#00ff9d" stroke-width="1.6"/><rect x="40" y="190" width="210" height="80" rx="11" fill="#00ff9d" opacity="0.06"/><text x="145.0" y="224.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="700" fill="#eaf6ff">Request ceiling</text><text x="145.0" y="243.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#00ff9d">hard max per run</text><rect x="266" y="190" width="210" height="80" rx="11" fill="#0a121b" stroke="#00ff9d" stroke-width="1.6"/><rect x="266" y="190" width="210" height="80" rx="11" fill="#00ff9d" opacity="0.06"/><text x="371.0" y="224.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="700" fill="#eaf6ff">Inter-request delay</text><text x="371.0" y="243.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#00ff9d">configurable ms</text><rect x="492" y="190" width="210" height="80" rx="11" fill="#0a121b" stroke="#00ff9d" stroke-width="1.6"/><rect x="492" y="190" width="210" height="80" rx="11" fill="#00ff9d" opacity="0.06"/><text x="597.0" y="224.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="700" fill="#eaf6ff">Full audit log</text><text x="597.0" y="243.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#00ff9d">every request sent</text><rect x="718" y="190" width="210" height="80" rx="11" fill="#0a121b" stroke="#00ff9d" stroke-width="1.6"/><rect x="718" y="190" width="210" height="80" rx="11" fill="#00ff9d" opacity="0.06"/><text x="823.0" y="224.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="700" fill="#eaf6ff">Non-mutating by default</text><text x="823.0" y="243.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#00ff9d">POST/PUT/PATCH/DELETE off</text><rect x="944" y="190" width="210" height="80" rx="11" fill="#0a121b" stroke="#ff3860" stroke-width="1.6"/><rect x="944" y="190" width="210" height="80" rx="11" fill="#ff3860" opacity="0.06"/><text x="1049.0" y="224.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="700" fill="#eaf6ff">No RCE checks</text><text x="1049.0" y="243.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#ff3860">command injection stays manual</text><text x="40" y="316" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#8fa3b8">Detection-only canary payloads: timing deltas, reflected markers, known error strings, redirect headers, arithmetic canaries.</text>
</svg>
