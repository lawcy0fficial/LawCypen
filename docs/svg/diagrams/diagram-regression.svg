<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="1200" height="270" role="img" aria-label="Regression">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00d9ff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3b8"/></marker>
    <style>
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes rot { to { transform: rotate(360deg) } }
      @keyframes fall { from { transform: translateY(-260px) } to { transform: translateY(420px) } }
      @keyframes dash { to { stroke-dashoffset: -40 } }
      @keyframes hl { 0%,100% { opacity:0 } 50% { opacity:.35 } }
      .p { animation: pulse 2.4s ease-in-out infinite }
      .d { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite }
      
    </style>
  </defs>
  <rect width="1200" height="270" rx="18" fill="#050810"/>
  <rect width="1200" height="270" rx="18" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="268" rx="18" fill="none" stroke="#00d9ff" stroke-opacity="0.28"/>
<text x="40" y="40" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="17" font-weight="800" letter-spacing="1.5" fill="#eaf6ff">REGRESSION SUITE — BASELINE, THEN DIFF</text><rect x="40.0" y="100" width="190.0" height="90" rx="11" fill="#0a121b" stroke="#00d9ff" stroke-width="1.6"/><rect x="40.0" y="100" width="190.0" height="90" rx="11" fill="#00d9ff" opacity="0.06"/><text x="135.0" y="139.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">Save check </text><text x="135.0" y="158.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#00d9ff">from Repeater</text><line x1="230.0" y1="145" x2="264.0" y2="145" stroke="#00d9ff" stroke-width="1.7" class="d" marker-end="url(#arr)"/><rect x="264.0" y="100" width="190.0" height="90" rx="11" fill="#0a121b" stroke="#00ff9d" stroke-width="1.6"/><rect x="264.0" y="100" width="190.0" height="90" rx="11" fill="#00ff9d" opacity="0.06"/><text x="359.0" y="139.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">Run 1</text><text x="359.0" y="158.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#00ff9d">establishes baseline</text><line x1="454.0" y1="145" x2="488.0" y2="145" stroke="#00ff9d" stroke-width="1.7" class="d" marker-end="url(#arr)"/><rect x="488.0" y="100" width="190.0" height="90" rx="11" fill="#0a121b" stroke="#ffb800" stroke-width="1.6"/><rect x="488.0" y="100" width="190.0" height="90" rx="11" fill="#ffb800" opacity="0.06"/><text x="583.0" y="139.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">Deploy / fix</text><text x="583.0" y="158.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#ffb800">something changes</text><line x1="678.0" y1="145" x2="712.0" y2="145" stroke="#ffb800" stroke-width="1.7" class="d" marker-end="url(#arr)"/><rect x="712.0" y="100" width="190.0" height="90" rx="11" fill="#0a121b" stroke="#ff3860" stroke-width="1.6"/><rect x="712.0" y="100" width="190.0" height="90" rx="11" fill="#ff3860" opacity="0.06"/><text x="807.0" y="139.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">Run 2+</text><text x="807.0" y="158.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#ff3860">diffed vs previous run</text><line x1="902.0" y1="145" x2="936.0" y2="145" stroke="#ff3860" stroke-width="1.7" class="d" marker-end="url(#arr)"/><rect x="936.0" y="100" width="190.0" height="90" rx="11" fill="#0a121b" stroke="#ff3ec9" stroke-width="1.6"/><rect x="936.0" y="100" width="190.0" height="90" rx="11" fill="#ff3ec9" opacity="0.06"/><text x="1031.0" y="139.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">Review diff</text><text x="1031.0" y="158.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#ff3ec9">what changed?</text><circle r="5" fill="#00ff9d" filter="url(#glow)"><animateMotion dur="5s" begin="0s" repeatCount="indefinite" path="M40 145 L1160 145"/></circle>
</svg>
