r="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#8fa3b8">Authorization: Bearer …</text><text x="620" y="186" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#8fa3b8">Cookie: session=…</text><rect x="880" y="100" width="260" height="130" rx="14" fill="#0a121b" stroke="#8fa3b8" stroke-width="1.5"/><text x="900" y="132" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="16" font-weight="800" fill="#8fa3b8">anonymous</text><text x="900" y="164" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#8fa3b8">Authorization: Bearer …</text><text x="900" y="186" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="400" fill="#8fa3b8">Cookie: session=…</text>
