<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="S3 decision">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00d9ff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3b8"/></marker>
    <style>
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes rot { to { transform: rotate(360deg) } }
      @keyframes fall { from { transform: translateY(-260px) } to { transform: translateY(420px) } }
      @keyframes dash { to { stroke-dashoffset: -40 } }
      @keyframes hl { 0%,100% { opacity:0 } 50% { opacity:.35 } }
      .p { animation: pulse 2.4s ease-in-out infinite }
      .d { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite }
      
    </style>
  </defs>
  <rect width="1200" height="320" rx="18" fill="#050810"/>
  <rect width="1200" height="320" rx="18" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="none" stroke="#00d9ff" stroke-opacity="0.28"/>
<text x="40" y="40" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="17" font-weight="800" letter-spacing="1.5" fill="#eaf6ff">S3 BUCKET CHECK — ONE GET, THREE OUTCOMES</text><text x="40" y="62" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#8fa3b8">https://s3.amazonaws.com/&lt;bucket&gt;</text><rect x="40" y="120" width="200" height="80" rx="11" fill="#0a121b" stroke="#00d9ff" stroke-width="1.6"/><rect x="40" y="120" width="200" height="80" rx="11" fill="#00d9ff" opacity="0.06"/><text x="140.0" y="154.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#eaf6ff">Bucket name</text><text x="140.0" y="173.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#00d9ff">from JS or traffic</text><rect x="560" y="70" width="330" height="64" rx="11" fill="#0a121b" stroke="#ff3860" stroke-width="1.6"/><rect x="560" y="70" width="330" height="64" rx="11" fill="#ff3860" opacity="0.06"/><text x="725.0" y="96.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">200 + ListBucketResult</text><text x="725.0" y="115.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#ff3860">PUBLICLY LISTABLE</text><line x1="240" y1="160" x2="560" y2="102" stroke="#ff3860" stroke-width="1.7" class="d" marker-end="url(#arr)"/><rect x="560" y="150" width="330" height="64" rx="11" fill="#0a121b" stroke="#00ff9d" stroke-width="1.6"/><rect x="560" y="150" width="330" height="64" rx="11" fill="#00ff9d" opacity="0.06"/><text x="725.0" y="176.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">403 AccessDenied</text><text x="725.0" y="195.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#00ff9d">private — properly secured</text><line x1="240" y1="160" x2="560" y2="182" stroke="#00ff9d" stroke-width="1.7" class="d" marker-end="url(#arr)"/><rect x="560" y="230" width="330" height="64" rx="11" fill="#0a121b" stroke="#ffb800" stroke-width="1.6"/><rect x="560" y="230" width="330" height="64" rx="11" fill="#ffb800" opacity="0.06"/><text x="725.0" y="256.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">404 NoSuchBucket</text><text x="725.0" y="275.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#ffb800">does not exist — takeover risk</text><line x1="240" y1="160" x2="560" y2="262" stroke="#ffb800" stroke-width="1.7" class="d" marker-end="url(#arr)"/><text x="920" y="160" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">no bulk download,</text><text x="920" y="176" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">ever</text>
</svg>
