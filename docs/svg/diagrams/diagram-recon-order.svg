<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Recon order">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00d9ff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3b8"/></marker>
    <style>
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes rot { to { transform: rotate(360deg) } }
      @keyframes fall { from { transform: translateY(-260px) } to { transform: translateY(420px) } }
      @keyframes dash { to { stroke-dashoffset: -40 } }
      @keyframes hl { 0%,100% { opacity:0 } 50% { opacity:.35 } }
      .p { animation: pulse 2.4s ease-in-out infinite }
      .d { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite }
      
    </style>
  </defs>
  <rect width="1200" height="300" rx="18" fill="#050810"/>
  <rect width="1200" height="300" rx="18" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="298" rx="18" fill="none" stroke="#00d9ff" stroke-opacity="0.28"/>
<text x="40" y="40" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="17" font-weight="800" letter-spacing="1.5" fill="#eaf6ff">SUGGESTED RECON ORDER</text><text x="40" y="62" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#8fa3b8">Quietest first, loudest last</text><rect x="40.0" y="100" width="164.66666666666666" height="100" rx="11" fill="#0a121b" stroke="#00ff9d" stroke-width="1.6"/><rect x="40.0" y="100" width="164.66666666666666" height="100" rx="11" fill="#00ff9d" opacity="0.06"/><text x="122.33333333333333" y="144.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="700" fill="#eaf6ff">Browse normally</text><text x="122.33333333333333" y="163.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#00ff9d">passive analyzers work</text><text x="122.33333333333333" y="226" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="700" fill="#00ff9d">0 requests</text><line x1="204.66666666666666" y1="150" x2="226.66666666666666" y2="150" stroke="#00ff9d" stroke-width="1.7" class="d" marker-end="url(#arr)"/><rect x="226.66666666666666" y="100" width="164.66666666666666" height="100" rx="11" fill="#0a121b" stroke="#00d9ff" stroke-width="1.6"/><rect x="226.66666666666666" y="100" width="164.66666666666666" height="100" rx="11" fill="#00d9ff" opacity="0.06"/><text x="309.0" y="144.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="700" fill="#eaf6ff">Cert Transparency</text><text x="309.0" y="163.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#00d9ff">crt.sh lookup</text><text x="309.0" y="226" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="700" fill="#00d9ff">third-party only</text><line x1="391.3333333333333" y1="150" x2="413.3333333333333" y2="150" stroke="#00d9ff" stroke-width="1.7" class="d" marker-end="url(#arr)"/><rect x="413.3333333333333" y="100" width="164.66666666666666" height="100" rx="11" fill="#0a121b" stroke="#00d9ff" stroke-width="1.6"/><rect x="413.3333333333333" y="100" width="164.66666666666666" height="100" rx="11" fill="#00d9ff" opacity="0.06"/><text x="495.66666666666663" y="144.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="700" fill="#eaf6ff">Subdomain DNS sweep</text><text x="495.66666666666663" y="163.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#00d9ff">dns.google</text><text x="495.66666666666663" y="226" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="700" fill="#00d9ff">never hits target HTTP</text><line x1="578.0" y1="150" x2="600.0" y2="150" stroke="#00d9ff" stroke-width="1.7" class="d" marker-end="url(#arr)"/><rect x="600.0" y="100" width="164.66666666666666" height="100" rx="11" fill="#0a121b" stroke="#ffb800" stroke-width="1.6"/><rect x="600.0" y="100" width="164.66666666666666" height="100" rx="11" fill="#ffb800" opacity="0.06"/><text x="682.3333333333334" y="144.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="700" fill="#eaf6ff">Scope → Discover</text><text x="682.3333333333334" y="163.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#ffb800">16 fixed paths</text><text x="682.3333333333334" y="226" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="700" fill="#ffb800">GET ×16</text><line x1="764.6666666666666" y1="150" x2="786.6666666666666" y2="150" stroke="#ffb800" stroke-width="1.7" class="d" marker-end="url(#arr)"/><rect x="786.6666666666666" y="100" width="164.66666666666666" height="100" rx="11" fill="#0a121b" stroke="#ffb800" stroke-width="1.6"/><rect x="786.6666666666666" y="100" width="164.66666666666666" height="100" rx="11" fill="#ffb800" opacity="0.06"/><text x="869.0" y="144.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="700" fill="#eaf6ff">Crawler</text><text x="869.0" y="163.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#ffb800">depth + page limits</text><text x="869.0" y="226" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="700" fill="#ffb800">real requests</text><line x1="951.3333333333333" y1="150" x2="973.3333333333333" y2="150" stroke="#ffb800" stroke-width="1.7" class="d" marker-end="url(#arr)"/><rect x="973.3333333333333" y="100" width="164.66666666666666" height="100" rx="11" fill="#0a121b" stroke="#ff3860" stroke-width="1.6"/><rect x="973.3333333333333" y="100" width="164.66666666666666" height="100" rx="11" fill="#ff3860" opacity="0.06"/><text x="1055.6666666666665" y="144.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" font-weight="700" fill="#eaf6ff">Content Discovery</text><text x="1055.6666666666665" y="163.0" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#ff3860">165 paths</text><text x="1055.6666666666665" y="226" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="700" fill="#ff3860">real requests</text><defs><linearGradient id="lg2" x1="0" x2="1"><stop offset="0" stop-color="#00ff9d"/><stop offset="1" stop-color="#ff3860"/></linearGradient></defs><rect x="40" y="250" width="1120" height="8" rx="4" fill="url(#lg2)" opacity="0.8"/><text x="40" y="278" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#00ff9d">quiet</text><text x="1160" y="278" text-anchor="end" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#ff3860">loud</text>
</svg>
