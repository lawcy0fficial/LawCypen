<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="CSP checks">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00d9ff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fa3b8"/></marker>
    <style>
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
      @keyframes rot { to { transform: rotate(360deg) } }
      @keyframes fall { from { transform: translateY(-260px) } to { transform: translateY(420px) } }
      @keyframes dash { to { stroke-dashoffset: -40 } }
      @keyframes hl { 0%,100% { opacity:0 } 50% { opacity:.35 } }
      .p { animation: pulse 2.4s ease-in-out infinite }
      .d { stroke-dasharray: 6 6; animation: dash 1.4s linear infinite }
      
    </style>
  </defs>
  <rect width="1200" height="470" rx="18" fill="#050810"/>
  <rect width="1200" height="470" rx="18" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="468" rx="18" fill="none" stroke="#00d9ff" stroke-opacity="0.28"/>
<text x="40" y="40" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="17" font-weight="800" letter-spacing="1.5" fill="#eaf6ff">CSP ANALYZER — WHAT GETS FLAGGED</text><text x="40" y="62" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#8fa3b8">Weak directives that let an XSS actually run despite a policy</text><rect x="40" y="80" width="550" height="60" rx="12" fill="#0a121b" stroke="#ff3860" stroke-width="1.3"/><text x="54" y="104" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">'unsafe-inline', no nonce/hash</text><rect x="516" y="89" width="60" height="20" rx="10" fill="#ff3860" opacity="0.18" stroke="#ff3860"/><text x="546" y="103" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10" font-weight="800" fill="#ff3860">HIGH</text><text x="54" y="126" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">directive: script-src</text><rect x="610" y="80" width="550" height="60" rx="12" fill="#0a121b" stroke="#ff3860" stroke-width="1.3"/><text x="624" y="104" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">Wildcard / scheme-wide source</text><rect x="1086" y="89" width="60" height="20" rx="10" fill="#ff3860" opacity="0.18" stroke="#ff3860"/><text x="1116" y="103" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10" font-weight="800" fill="#ff3860">HIGH</text><text x="624" y="126" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">directive: script-src</text><rect x="40" y="152" width="550" height="60" rx="12" fill="#0a121b" stroke="#ff3860" stroke-width="1.3"/><text x="54" y="176" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">No effective script restriction</text><rect x="516" y="161" width="60" height="20" rx="10" fill="#ff3860" opacity="0.18" stroke="#ff3860"/><text x="546" y="175" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10" font-weight="800" fill="#ff3860">HIGH</text><text x="54" y="198" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">directive: script-src / default-src</text><rect x="610" y="152" width="550" height="60" rx="12" fill="#0a121b" stroke="#ffb800" stroke-width="1.3"/><text x="624" y="176" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">'unsafe-eval' allowed</text><rect x="1086" y="161" width="60" height="20" rx="10" fill="#ffb800" opacity="0.18" stroke="#ffb800"/><text x="1116" y="175" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10" font-weight="800" fill="#ffb800">MEDIUM</text><text x="624" y="198" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">directive: script-src</text><rect x="40" y="224" width="550" height="60" rx="12" fill="#0a121b" stroke="#ffb800" stroke-width="1.3"/><text x="54" y="248" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">data: scheme allowed</text><rect x="516" y="233" width="60" height="20" rx="10" fill="#ffb800" opacity="0.18" stroke="#ffb800"/><text x="546" y="247" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10" font-weight="800" fill="#ffb800">MEDIUM</text><text x="54" y="270" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">directive: script-src</text><rect x="610" y="224" width="550" height="60" rx="12" fill="#0a121b" stroke="#ffb800" stroke-width="1.3"/><text x="624" y="248" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">base-uri unrestricted</text><rect x="1086" y="233" width="60" height="20" rx="10" fill="#ffb800" opacity="0.18" stroke="#ffb800"/><text x="1116" y="247" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10" font-weight="800" fill="#ffb800">MEDIUM</text><text x="624" y="270" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">directive: base-uri</text><rect x="40" y="296" width="550" height="60" rx="12" fill="#0a121b" stroke="#ffb800" stroke-width="1.3"/><text x="54" y="320" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">frame-ancestors missing</text><rect x="516" y="305" width="60" height="20" rx="10" fill="#ffb800" opacity="0.18" stroke="#ffb800"/><text x="546" y="319" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10" font-weight="800" fill="#ffb800">MEDIUM</text><text x="54" y="342" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">directive: frame-ancestors</text><rect x="610" y="296" width="550" height="60" rx="12" fill="#0a121b" stroke="#ffb800" stroke-width="1.3"/><text x="624" y="320" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">frame-ancestors wildcard</text><rect x="1086" y="305" width="60" height="20" rx="10" fill="#ffb800" opacity="0.18" stroke="#ffb800"/><text x="1116" y="319" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10" font-weight="800" fill="#ffb800">MEDIUM</text><text x="624" y="342" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">directive: frame-ancestors</text><rect x="40" y="368" width="550" height="60" rx="12" fill="#0a121b" stroke="#00d9ff" stroke-width="1.3"/><text x="54" y="392" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">object-src not 'none'</text><rect x="516" y="377" width="60" height="20" rx="10" fill="#00d9ff" opacity="0.18" stroke="#00d9ff"/><text x="546" y="391" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10" font-weight="800" fill="#00d9ff">LOW</text><text x="54" y="414" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">directive: object-src</text><rect x="610" y="368" width="550" height="60" rx="12" fill="#0a121b" stroke="#8fa3b8" stroke-width="1.3"/><text x="624" y="392" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#eaf6ff">upgrade-insecure-requests unset</text><rect x="1086" y="377" width="60" height="20" rx="10" fill="#8fa3b8" opacity="0.18" stroke="#8fa3b8"/><text x="1116" y="391" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="10" font-weight="800" fill="#8fa3b8">INFO</text><text x="624" y="414" text-anchor="start" font-family="ui-monospace,'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="400" fill="#8fa3b8">directive: non-HTTPS response</text>
</svg>
