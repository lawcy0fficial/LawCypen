<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" role="img" aria-label="Roadmap icon">
  <defs>
    <radialGradient id="bg-roadmap" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#12081e"/>
      <stop offset="100%" stop-color="#08050f"/>
    </radialGradient>
    <linearGradient id="ring-roadmap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b829ff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#b829ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#b829ff" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow-roadmap" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid-roadmap" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#b829ff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <style>
      .card-roadmap { animation: fadeIn-roadmap .6s ease-out; }
      .spin-roadmap { transform-origin: 110px 110px; animation: spin-roadmap 7s linear infinite; }
      .spin-rev-roadmap { transform-origin: 110px 110px; animation: spinrev-roadmap 11s linear infinite; }
      .pulse-roadmap { animation: pulse-roadmap 2.4s ease-in-out infinite; transform-origin: 110px 96px; }
      .scan-roadmap { animation: scan-roadmap 2.8s ease-in-out infinite; }
      .blink-roadmap { animation: blink-roadmap 1.6s ease-in-out infinite; }
      @keyframes fadeIn-roadmap { from { opacity: 0; } to { opacity: 1; } }
      @keyframes spin-roadmap { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes spinrev-roadmap { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
      @keyframes pulse-roadmap { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.09); opacity: .82; } }
      @keyframes scan-roadmap { 0% { transform: translateY(-70px); opacity: 0; } 12% { opacity: .9; } 88% { opacity: .9; } 100% { transform: translateY(70px); opacity: 0; } }
      @keyframes blink-roadmap { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect x="1" y="1" width="218" height="218" rx="20" fill="url(#bg-roadmap)"/>
  <rect x="1" y="1" width="218" height="218" rx="20" fill="url(#grid-roadmap)"/>

  <g class="card-roadmap">
    <rect x="6" y="6" width="208" height="208" rx="17" fill="none" stroke="url(#ring-roadmap)" stroke-width="1.6"/>

    <g class="spin-roadmap" opacity="0.55">
      <circle cx="110" cy="110" r="88" fill="none" stroke="#b829ff" stroke-width="1" stroke-dasharray="2 10" stroke-linecap="round"/>
    </g>
    <g class="spin-rev-roadmap" opacity="0.35">
      <circle cx="110" cy="110" r="78" fill="none" stroke="#b829ff" stroke-width="1" stroke-dasharray="1 7" stroke-linecap="round"/>
    </g>

    <!-- corner brackets (HUD reticle) -->
    <g stroke="#b829ff" stroke-width="2.2" fill="none" stroke-linecap="round">
      <path d="M16 32V16H32"/>
      <path d="M204 32V16H188"/>
      <path d="M16 188V204H32"/>
      <path d="M204 188V204H188"/>
    </g>

    <clipPath id="clip-roadmap"><rect x="6" y="6" width="208" height="208" rx="17"/></clipPath>
    <rect class="scan-roadmap" x="6" width="208" height="26" fill="#b829ff" opacity="0.08" clip-path="url(#clip-roadmap)"/>

    <circle class="pulse-roadmap" cx="110" cy="96" r="46" fill="#b829ff" opacity="0.08"/>
    <text class="pulse-roadmap" x="110" y="112" text-anchor="middle" font-size="52" font-family="'Segoe UI Symbol','DejaVu Sans',sans-serif" fill="#b829ff" filter="url(#glow-roadmap)">➤</text>

    <circle class="blink-roadmap" cx="184" cy="36" r="3.4" fill="#b829ff"/>

    <line x1="30" y1="168" x2="190" y2="168" stroke="#b829ff" stroke-width="1" stroke-opacity="0.35"/>
    <text x="110" y="190" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#eaf6ff">Roadmap</text>
    <text x="110" y="202" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" letter-spacing="2.5" fill="#b829ff" opacity="0.75">LAWCYPEN</text>
  </g>
</svg>
