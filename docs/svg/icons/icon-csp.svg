<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" role="img" aria-label="CSP Analyzer icon">
  <defs>
    <radialGradient id="bg-csp" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#1c1503"/>
      <stop offset="100%" stop-color="#120c02"/>
    </radialGradient>
    <linearGradient id="ring-csp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d9ff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#00d9ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00d9ff" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow-csp" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid-csp" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#00d9ff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <style>
      .card-csp { animation: fadeIn-csp .6s ease-out; }
      .spin-csp { transform-origin: 110px 110px; animation: spin-csp 7s linear infinite; }
      .spin-rev-csp { transform-origin: 110px 110px; animation: spinrev-csp 11s linear infinite; }
      .pulse-csp { animation: pulse-csp 2.4s ease-in-out infinite; transform-origin: 110px 96px; }
      .scan-csp { animation: scan-csp 2.8s ease-in-out infinite; }
      .blink-csp { animation: blink-csp 1.6s ease-in-out infinite; }
      @keyframes fadeIn-csp { from { opacity: 0; } to { opacity: 1; } }
      @keyframes spin-csp { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes spinrev-csp { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
      @keyframes pulse-csp { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.09); opacity: .82; } }
      @keyframes scan-csp { 0% { transform: translateY(-70px); opacity: 0; } 12% { opacity: .9; } 88% { opacity: .9; } 100% { transform: translateY(70px); opacity: 0; } }
      @keyframes blink-csp { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect x="1" y="1" width="218" height="218" rx="20" fill="url(#bg-csp)"/>
  <rect x="1" y="1" width="218" height="218" rx="20" fill="url(#grid-csp)"/>

  <g class="card-csp">
    <rect x="6" y="6" width="208" height="208" rx="17" fill="none" stroke="url(#ring-csp)" stroke-width="1.6"/>

    <g class="spin-csp" opacity="0.55">
      <circle cx="110" cy="110" r="88" fill="none" stroke="#00d9ff" stroke-width="1" stroke-dasharray="2 10" stroke-linecap="round"/>
    </g>
    <g class="spin-rev-csp" opacity="0.35">
      <circle cx="110" cy="110" r="78" fill="none" stroke="#00d9ff" stroke-width="1" stroke-dasharray="1 7" stroke-linecap="round"/>
    </g>

    <!-- corner brackets (HUD reticle) -->
    <g stroke="#00d9ff" stroke-width="2.2" fill="none" stroke-linecap="round">
      <path d="M16 32V16H32"/>
      <path d="M204 32V16H188"/>
      <path d="M16 188V204H32"/>
      <path d="M204 188V204H188"/>
    </g>

    <clipPath id="clip-csp"><rect x="6" y="6" width="208" height="208" rx="17"/></clipPath>
    <rect class="scan-csp" x="6" width="208" height="26" fill="#00d9ff" opacity="0.08" clip-path="url(#clip-csp)"/>

    <circle class="pulse-csp" cx="110" cy="96" r="46" fill="#00d9ff" opacity="0.08"/>
    <text class="pulse-csp" x="110" y="112" text-anchor="middle" font-size="52" font-family="'Segoe UI Symbol','DejaVu Sans',sans-serif" fill="#00d9ff" filter="url(#glow-csp)">◪</text>

    <circle class="blink-csp" cx="184" cy="36" r="3.4" fill="#00d9ff"/>

    <line x1="30" y1="168" x2="190" y2="168" stroke="#00d9ff" stroke-width="1" stroke-opacity="0.35"/>
    <text x="110" y="190" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#eaf6ff">CSP Analyzer</text>
    <text x="110" y="202" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" letter-spacing="2.5" fill="#00d9ff" opacity="0.75">LAWCYPEN</text>
  </g>
</svg>
